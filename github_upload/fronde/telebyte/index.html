<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Télébyte · La Grande Fronde</title>
<style>
  /* Télébyte : antenne sobre sur le noir de l'espace — un seul accent (le cyan des tracés), les couleurs des racers
     ne servent qu'à les reconnaître. Mise en page : scène plein écran, bandeau d'antenne en haut, classement à
     droite (en bas sur téléphone), horloge de course tout en bas. */
  :root {
    color-scheme: dark;
    --bg: #020306; --ink: #e6eef3; --dim: #8b9aa6; --faint: #5a6873; --line: rgba(159, 212, 236, .18);
    --panel: rgba(4, 8, 13, .78); --accent: #9fd4ec; --live: #ff5a4f;
    --f-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --f-num: ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, monospace;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 var(--f-ui); overflow: hidden; -webkit-user-select: none; user-select: none; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  /* vue système intégrée (zoom continu) : préchargée, invisible, au-dessus de tout une fois entrée */
  #sysframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; opacity: 0; pointer-events: none; z-index: 40; transition: opacity .3s; }
  /* mini barre de progression de l'entrée dans un système (animée par le compositeur : elle bouge même si le calcul occupe le fil principal) */
  #load { position: fixed; left: 50%; top: 58%; translate: -50% 0; z-index: 60; display: grid; gap: 7px; justify-items: center; pointer-events: none; transition: opacity .25s; }
  #load[hidden] { display: none; } #load.out { opacity: 0; }
  #load span { font: 600 11px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: #eaf6ff; text-shadow: 0 0 8px rgba(0, 20, 40, .9); }
  #load i { display: block; width: 168px; height: 3px; border-radius: 2px; background: rgba(4, 12, 24, .55); overflow: hidden; box-shadow: 0 0 0 1px rgba(160, 210, 255, .25); }
  #load b { display: block; height: 100%; width: 100%; background: #9fe6ff; transform-origin: 0 50%; transform: scaleX(0); box-shadow: 0 0 8px #9fe6ff; }
  #sysframe.on { opacity: 1; pointer-events: auto; }
  #scene canvas { display: block; width: 100%; height: 100%; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .tb-sys { position: absolute; left: 0; top: 0; text-align: center; translate: -50% 0; pointer-events: auto; background: none; border: 0; color: var(--ink); font: inherit; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .tb-sys:hover b, .tb-sys:focus-visible b { color: var(--accent); }
  .tb-sys:focus-visible { outline: 2px solid var(--accent); }
  .tb-sys b { display: block; font-size: 11px; letter-spacing: .26em; text-transform: uppercase; font-weight: 700; }
  .tb-sys span { font: 10px var(--f-num); color: var(--dim); letter-spacing: .08em; }
  .tb-racer { position: absolute; left: 0; top: 0; translate: -7px -7px; display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: var(--ink); font: 600 11px var(--f-ui); pointer-events: auto; cursor: pointer; transition: opacity .3s; }
  .tb-racer i { width: 10px; height: 10px; border-radius: 50%; background: var(--livery); box-shadow: 0 0 0 2px rgba(2, 3, 6, .9), 0 0 10px var(--livery); }
  .tb-racer span { padding: 1px 6px; border-radius: 4px; background: rgba(2, 3, 6, .62); }
  .tb-racer.left { flex-direction: row-reverse; translate: calc(-100% + 7px) -7px; }   /* près du bord droit : étiquette à gauche du point */
  .tb-racer.on span { background: var(--livery); color: #05080c; }
  .tb-racer.dim { opacity: .45; }
  .tb-racer:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  header { position: fixed; top: 0; left: 0; right: 0; padding: calc(var(--sat) + 12px) max(16px, var(--sar)) 0 max(16px, var(--sal)); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
  .brand b { display: block; font-size: 12px; font-weight: 800; letter-spacing: .38em; }
  .brand b em { font-style: normal; color: var(--accent); }
  .brand span { display: block; margin-top: 3px; font-size: 11px; color: var(--dim); }
  .brand small#route { display: none; } .brand small { display: block; margin-top: 2px; font-size: 10px; letter-spacing: .14em; color: var(--faint); text-transform: uppercase; }
  .onair { text-align: right; }
  .onair .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
  .onair .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); }
  .onair .t { display: block; margin-top: 6px; font: 600 20px var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .02em; }

  #board { position: fixed; right: max(16px, var(--sar)); top: calc(var(--sat) + 78px); width: 290px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 0 6px; backdrop-filter: blur(6px); }
  #board h2 { margin: 0 14px 6px; font-size: 10px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); }
  #standings { list-style: none; margin: 0; padding: 0; }
  /* classement repliable : une seule ligne (le premier) pour libérer la vue */
  #board-h { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; padding: 2px 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
  #board-h span { flex: none; } #board-h em { flex: 1; min-width: 0; font-style: normal; text-transform: none; letter-spacing: .02em; color: var(--ink); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; visibility: hidden; }
  #board-h svg { width: 14px; height: 14px; flex: none; transition: transform .2s; }
  body.board-min #board-h svg { transform: rotate(180deg); } body.board-min #board-h em { visibility: visible; }
  body.board-min #standings, body.board-min #focus { display: none; }
  body.board-min #board { padding-bottom: 4px; }
  #standings li { display: grid; grid-template-columns: 22px 8px 1fr auto; align-items: center; gap: 8px; padding: 7px 14px; cursor: pointer; border-top: 1px solid rgba(159, 212, 236, .06); }
  #standings li:hover, #standings li.on { background: rgba(159, 212, 236, .08); }
  #standings .rk { font: 700 13px var(--f-num); color: var(--dim); }
  #standings i { width: 8px; height: 22px; border-radius: 2px; background: var(--livery); }
  #standings .nm { font-weight: 600; min-width: 0; }
  #standings .nm small { display: block; font-weight: 400; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #standings .gp { font: 12px var(--f-num); font-variant-numeric: tabular-nums; color: var(--ink); }
  #focus { margin: 8px 14px 4px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 11px; color: var(--dim); }
  #focus b { color: var(--ink); }
  #focus button { float: right; margin-left: 6px; background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 6px; font: inherit; padding: 1px 7px; cursor: pointer; }

  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, var(--sar)) calc(var(--sab) + 12px) max(16px, var(--sal)); display: flex; gap: 10px; align-items: center; background: linear-gradient(to top, rgba(2, 3, 6, .9), rgba(2, 3, 6, 0)); }
  footer .track { flex: 1; min-width: 0; } footer [hidden] { display: none; }
  footer button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font: 600 12px var(--f-ui); cursor: pointer; min-width: 64px; }
  footer button:focus-visible, #clock:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .track { min-width: 0; }
  #clock { width: 100%; accent-color: var(--accent); margin: 0; }
  #next { display: block; margin-top: 3px; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #next::before { content: "Prochain · "; color: var(--faint); }

  /* étapes : un bouton par système, qui saute à l'instant fort (passage du premier racer) et ouvre la vue système */
  #stages { display: flex; gap: 6px; margin-top: 8px; pointer-events: auto; flex-wrap: wrap; }
  #stages button { font: inherit; font-size: 11px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px 5px 8px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
  #stages button b { font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 10px; }
  #stages button span { font: 10px var(--f-num); color: var(--dim); }
  #stages button.now { border-color: var(--accent); }
  #stages button.now span { color: var(--accent); }
  #stages button:hover, #stages button:focus-visible { border-color: var(--accent); outline: none; }
  #stages button::before { content: '▶'; font-size: 8px; color: var(--accent); }
  .tb-sys i { display: block; margin-top: 2px; font: normal 9px var(--f-num); color: var(--accent); letter-spacing: .06em; opacity: .85; }
  /* direct et paris (Phase 3) */
  body.in-game header { padding-right: calc(max(16px, var(--sar)) + 46px); }
  .onair .pill, .onair .t { white-space: nowrap; }
  #play.live { color: #ff6a6a; border-color: rgba(255, 106, 106, .5); }
  #offline { position: fixed; left: 50%; top: calc(var(--sat) + 116px); white-space: nowrap; translate: -50% 0; z-index: 30; font-size: 11px; color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; pointer-events: none; }
  #try-bets { display: block; margin: 6px 0 0 auto; pointer-events: auto; font: 600 10px var(--f-ui); letter-spacing: .08em; color: #ffd27a; background: var(--panel); border: 1px solid rgba(255, 210, 122, .45); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  #bets-btn { color: #ffd27a; border-color: rgba(255, 210, 122, .45); }
  #bets { position: fixed; left: max(12px, var(--sal)); right: max(12px, var(--sar)); bottom: calc(var(--sab) + 74px); z-index: 46; max-width: 440px; margin: 0 auto; max-height: 70vh; overflow-y: auto; background: rgba(6, 10, 18, .96); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 12px; backdrop-filter: blur(8px); }
  #bets[hidden] { display: none; }
  #bets header { position: static; padding: 0; display: flex; justify-content: space-between; align-items: center; pointer-events: auto; margin-bottom: 6px; }
  #bets header b { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); }
  #bets-close { background: none; border: 0; color: var(--ink); font-size: 20px; cursor: pointer; }
  #bets p { margin: 6px 0; font-size: 12px; color: var(--ink); line-height: 1.4; }
  #bets .bt-h b { color: #ffd27a; }
  .bt-rows { list-style: none; margin: 6px 0; padding: 0; }
  .bt-rows li { display: grid; grid-template-columns: 10px 1fr 70px 80px; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .bt-rows li.on { border-color: var(--livery); background: rgba(255, 255, 255, .04); }
  .bt-rows li.win .nm::after { content: ' ★'; color: #ffd27a; }
  .bt-rows i { width: 10px; height: 10px; border-radius: 50%; background: var(--livery); }
  .bt-rows .nm { font-weight: 600; font-size: 13px; }
  .bt-rows .bar { height: 4px; background: rgba(255, 255, 255, .08); border-radius: 2px; overflow: hidden; } .bt-rows .bar u { display: block; height: 100%; background: var(--livery); }
  .bt-rows .od { text-align: right; font: 600 12px var(--f-num); color: #ffd27a; }
  #bets .bt-pool, #bets .bt-sub, #bets .bt-fair { font-size: 11px; color: var(--dim); }
  .bt-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .bt-form label { font-size: 12px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
  .bt-form input { width: 90px; font: 600 14px var(--f-num); color: var(--ink); background: rgba(255, 255, 255, .06); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .bt-chips { display: flex; gap: 4px; } .bt-chips button { font: 11px var(--f-num); color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; cursor: pointer; }
  #bt-go { flex: 1 1 100%; font: 700 13px var(--f-ui); color: #05080c; background: #ffd27a; border: 0; border-radius: 8px; padding: 10px; cursor: pointer; }
  #bt-go:disabled { background: rgba(255, 210, 122, .3); color: rgba(5, 8, 12, .6); cursor: default; }
  #bets .bt-gain { color: #7fe08a; font-size: 12px; min-height: 1em; }
  .bt-mine { list-style: none; margin: 8px 0 4px; padding: 0; font-size: 12px; } .bt-mine li { padding: 2px 0; display: flex; gap: 6px; align-items: center; } .bt-mine li.t { color: var(--dim); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; } .bt-mine i { width: 7px; height: 7px; border-radius: 50%; background: var(--livery); }
  .bt-tabs { display: flex; gap: 4px; margin: 0 0 8px; border-bottom: 1px solid var(--line); }
  .bt-tabs button { flex: 1; font: 600 11px var(--f-ui); letter-spacing: .06em; color: var(--dim); background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 2px 7px; cursor: pointer; }
  .bt-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: #ffd27a; }
  .bt-anon { flex: 1 1 100%; display: flex !important; gap: 8px !important; align-items: flex-start !important; font-size: 12px !important; color: var(--ink) !important; cursor: pointer; } .bt-anon input { margin: 2px 0 0; width: 16px; height: 16px; } .bt-anon small { display: block; color: var(--dim); font-size: 10px; margin-top: 1px; }
  #bets .bt-test { color: #ffb46a; font-size: 11px; } .bt-admin button { font: 600 11px var(--f-ui); color: #ffb46a; background: none; border: 1px dashed rgba(255, 180, 106, .5); border-radius: 8px; padding: 7px 10px; cursor: pointer; width: 100%; }
  .bt-feed, .bt-rank { list-style: none; margin: 4px 0; padding: 0; font-size: 12px; }
  .bt-feed li { display: grid; grid-template-columns: 8px 1fr auto; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid rgba(255, 255, 255, .05); }
  .bt-feed i { width: 7px; height: 7px; border-radius: 50%; background: var(--livery); align-self: center; } .bt-feed small { color: var(--dim); font-size: 10px; white-space: nowrap; }
  .bt-rank { counter-reset: r; } .bt-rank li { display: flex; justify-content: space-between; padding: 4px 0; counter-increment: r; } .bt-rank li span::before { content: counter(r) '. '; color: var(--dim); }
  .bt-rank li.me span { color: #ffd27a; } .bt-rank .up { color: #7fe08a; } .bt-rank .down { color: #ff8a7a; }
  .bt-chat { max-height: 38vh; overflow-y: auto; margin: 0 0 8px; } .bt-chat p { margin: 0 0 8px !important; font-size: 12px; } .bt-chat p.me b { color: #ffd27a; } .bt-chat small { color: var(--dim); font-size: 10px; }
  .bt-say { display: flex; gap: 6px; } .bt-say input { flex: 1; min-width: 0; font: 14px var(--f-ui); color: var(--ink); background: rgba(255, 255, 255, .06); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .bt-say button { font: 700 12px var(--f-ui); color: #05080c; background: #9fe6ff; border: 0; border-radius: 8px; padding: 0 12px; cursor: pointer; }
  #bets .bt-msg { color: #9fe6ff; } #bets .bt-pay b { color: #7fe08a; } #bets code { font: 10px var(--f-num); }
  /* voix off et fil d'actualité (Phase 4) */
  .tb-hz { position: absolute; left: 0; top: 0; translate: -50% -50%; pointer-events: none; font: 9px var(--f-num); color: var(--faint); white-space: nowrap; line-height: 1.35; text-align: left; padding: 2px 6px; border-radius: 4px; background: rgba(2, 3, 6, .55); }
  .tb-hz em { font-style: normal; color: #cdb999; } .tb-hz em.fl { color: #ffb070; } .tb-hz b { font-weight: 400; color: var(--dim); }
  .tb-hz.on { color: #ffd27a; border: 1px solid rgba(255, 154, 64, .6); } .tb-hz.on b::after { content: ' · en cours !'; color: #ffd27a; } .tb-hz.on { translate: -50% -50%; }
  #corridor { position: fixed; z-index: 29; left: max(10px, var(--sal)); right: max(10px, var(--sar)); top: calc(var(--sat) + 152px); bottom: var(--corr-b, 300px); border: 1px solid rgba(255, 201, 160, .3); border-radius: 12px; overflow: hidden; background: rgba(2, 4, 9, .4); }
  #corridor[hidden] { display: none; }
  #corridor { min-height: 190px; }
  @media (max-height: 520px) { #corridor { top: calc(var(--sat) + 92px) !important; bottom: calc(var(--sab) + 66px) !important; right: max(10px, var(--sar)) !important; min-height: 0; } body.corr #board { display: none; } }
  #corridor .co-bar { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 8px 0 12px; border-bottom: 1px solid rgba(255, 201, 160, .18); }
  #corridor .co-title { flex: 1; min-width: 0; font: 600 10px var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: #ffc9a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #corridor .co-views { display: flex; gap: 4px; }
  #corridor .co-views button { font: 600 11px var(--f-ui); color: var(--dim); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 9px; cursor: pointer; }
  #corridor .co-views button.on { color: var(--ink); border-color: #ffc9a0; }
  #corridor .co-views button[data-v="close"] { border: 0; font-size: 18px; padding: 0 4px; color: var(--ink); }
  #corridor canvas { display: block; touch-action: manipulation; }
  body.corr #news { display: none; } body.corr .tb-hz, body.corr .tb-racer, body.corr .tb-sys { visibility: hidden; }
  #stages button.leg { padding: 4px 7px; } #stages button.leg::before { content: '⇢'; font-size: 11px; color: #ffc9a0; }
  #stages button.leg.now { border-color: #ffc9a0; }
  @media (min-width: 721px) { #corridor { right: calc(max(16px, var(--sar)) + 306px); top: calc(var(--sat) + 160px); } }
  .pill-row { display: inline-flex; align-items: center; gap: 6px; }
  #voice { pointer-events: auto; width: 26px; height: 26px; font-size: 14px; line-height: 1; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 50%; padding: 0; cursor: pointer; }
  #voice.off { opacity: .55; }
  #tv { pointer-events: auto; width: 26px; height: 26px; font-size: 13px; line-height: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 50%; padding: 0; cursor: pointer; opacity: .55; }
  #tv.on { opacity: 1; border-color: #ffd27a; box-shadow: 0 0 0 1px rgba(255, 210, 122, .3); }
  #lower { position: fixed; z-index: 44; left: max(12px, var(--sal)); top: calc(var(--sat) + 152px); max-width: calc(100% - 24px); font: 12px var(--f-ui); color: var(--ink); background: rgba(6, 10, 18, .9); border: 1px solid rgba(255, 210, 122, .45); border-radius: 8px; padding: 6px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #lower[hidden] { display: none; } #lower b { color: #ffd27a; margin-right: 4px; } #lower span { font-weight: 700; } #lower u { color: #9fe6ff; cursor: pointer; padding: 4px 2px; }
  body.insys #lower { top: calc(var(--sat) + 120px); left: 50%; translate: -50% 0; max-width: calc(100% - 40px); font-size: 11px; padding: 4px 9px; }
  body.corr #lower { top: calc(var(--sat) + 116px); }
  body.insys #lower.mini { display: none; }
  #news { position: fixed; z-index: 30; left: max(12px, var(--sal)); top: calc(var(--sat) + 116px); max-width: min(440px, calc(100% - 24px)); display: flex; gap: 7px; align-items: baseline; font: 12px var(--f-ui); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--live); border-radius: 8px; padding: 6px 10px; cursor: pointer; text-align: left; backdrop-filter: blur(6px); }
  #news[hidden] { display: none; }
  #news .nw-k { font-size: 9px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--live); white-space: nowrap; }
  #news .nw-t { font: 10px var(--f-num); color: var(--dim); white-space: nowrap; }
  #news .nw-h { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  #news.flash { animation: nwflash 1.2s ease-out; }
  @keyframes nwflash { 0% { background: rgba(255, 90, 79, .45); } 100% { background: var(--panel); } }
  #news-list { position: fixed; left: max(12px, var(--sal)); right: max(12px, var(--sar)); top: calc(var(--sat) + 152px); z-index: 47; max-width: 440px; max-height: 60vh; overflow-y: auto; background: rgba(6, 10, 18, .96); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 12px; backdrop-filter: blur(8px); }
  #news-list[hidden] { display: none; }
  #news-list header { position: static; padding: 0; display: flex; justify-content: space-between; align-items: center; pointer-events: auto; margin-bottom: 4px; }
  #news-list header b { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); }
  #news-close { background: none; border: 0; color: var(--ink); font-size: 20px; cursor: pointer; }
  .nw-rows { list-style: none; margin: 0; padding: 0; }
