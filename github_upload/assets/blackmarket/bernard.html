<style>
/* Layout : vue 3D plein écran (fiche d'unité), HUD minimal en surimpression. Look unique sombre, assumé (charte Starbyte). */
:root {
  --space: #0b0f12;          /* noir spatial Starbyte */
  --ink: #e8ecf1;
  --ink-dim: #8a96a6;
  --amber: #f0a040;          /* accent données (ambre, pas de cyan hors navigation) */
  --hull-orange: #c8231c;    /* rouge du regard */
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--space); color: var(--ink);
  font-family: var(--font-display); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; }
.hud {
  position: fixed; left: 0; right: 0; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud-top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 18px); padding-bottom: 48px;
  background: linear-gradient(to bottom, rgba(2,4,9,.72), rgba(2,4,9,0)); }
.hud-bottom { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); padding-top: 48px;
  background: linear-gradient(to top, rgba(2,4,9,.75), rgba(2,4,9,0)); }
.eyebrow {
  font-family: var(--font-data); font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-dim); display: flex; align-items: center; gap: 8px;
}
.eyebrow::before { content: ""; width: 14px; height: 3px; background: var(--hull-orange); }
.name { font-weight: 600; font-size: clamp(34px, 9vw, 56px); line-height: 1; letter-spacing: -.01em; margin: 8px 0 4px; text-wrap: balance; }
.class { font-family: var(--font-data); font-size: 13px; color: var(--ink-dim); }
.specs { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 0; padding: 0; list-style: none;
  font-family: var(--font-data); font-size: 12px; font-variant-numeric: tabular-nums; }
.specs li { display: flex; gap: 6px; align-items: baseline; }
.specs span.k { color: var(--ink-dim); text-transform: uppercase; letter-spacing: .1em; font-size: 10px; }
.specs b { color: var(--ink); font-weight: 500; }
.specs b.amber { color: var(--amber); }
.hint { margin-top: 14px; font-family: var(--font-data); font-size: 11px; color: var(--ink-dim); letter-spacing: .06em; transition: opacity .8s ease; }
.hint.gone { opacity: 0; }
.loader { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-family: var(--font-data); font-size: 12px; color: var(--ink-dim); letter-spacing: .1em; transition: opacity .6s ease; }
.loader.done { opacity: 0; }
.bar { width: 160px; height: 2px; background: rgba(255,255,255,.08); margin-top: 10px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .2s; }
.err { color: var(--amber); max-width: 30ch; text-align: center; line-height: 1.5; }
@media (prefers-reduced-motion: reduce) { .hint, .loader { transition: none; } }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================================================================== réglages */
const S = 0.01;                                   // 1 unité = 100 m de scène
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ORBIT = /[?&]orbit=1/.test(location.search);   // ambassade : à l'arrêt en orbite — réacteurs éteints, aucun effet de déplacement, planète en arrière-plan
const ENGINE_COLOR = new THREE.Color(1.0, 0.50, 0.22);   // propergol solide : orange incandescent
// FATHER-ID (1 300 m, des canons du mufle aux tuyères) au gabarit de scène du KV-01 : V = 0,9 m de scène par m réel,
// proue (glTF z = +664 m, bouches des canons) recalée sur z = 600.
const V = 0.9, BOW_GLTF = 664, BOW_SCENE = 600;
// 3 grandes tuyères en ligne + 2 petites dessous (vue arrière du dossier)
const NOZZLES = [[0, -30, 74, 1296], [170, -30, 70, 1296], [-170, -30, 70, 1296], [84, -204, 48, 1282], [-84, -204, 48, 1282]]
  .map(([cx, cz, r, end]) => ({ x: cx * V, y: cz * V, r: r * 0.72 * V, z: BOW_SCENE - (end - 650 + 664 + 4) * V }));
const NOZZLE_Z = BOW_SCENE - (1296 - 650 + 664) * V;
// acier marbré poli (rendu du dossier) : [rugosité, métal, reflets d'environnement]
const GLOSS = {
  M_FD_PLATE: [0.30, 0.78, 0.60], M_FD_PLATE2: [0.34, 0.74, 0.52], M_FD_HULL: [0.85, 0.15, 0.15], M_FD_MECH: [0.75, 0.30, 0.25],
  M_FD_STEEL: [0.60, 0.50, 0.35], M_FD_HORN: [0.40, 0.82, 0.55], M_FD_HORN2: [0.46, 0.78, 0.5], M_FD_MUZZLE: [0.30, 0.82, 0.65],
  M_KV_STRUCT_BLACK: [0.45, 0.4, 0.35],
  M_FD_ARMOR: [0.62, 0.55, 0.26], M_FD_ARMORL: [0.60, 0.58, 0.26], M_FD_SNOUT: [0.52, 0.50, 0.45]
};

/* ================================================================== moteur de rendu */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010207);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 600);
const BASE_FOV = () => camera.aspect < 0.8 ? 54 : 40;
const WIDE_FOV = () => camera.aspect < 0.8 ? 92 : 78;
function fitDistance() {
  if (fitDistance.cached) return fitDistance.cached;
  camera.fov = BASE_FOV(); camera.updateProjectionMatrix();
  const v = THREE.MathUtils.degToRad(camera.fov) / 2;
  const h = Math.atan(Math.tan(v) * camera.aspect);
  const half = camera.aspect < 0.8 ? 4.9 : 5.2;
  return (fitDistance.cached = Math.max(8.5, half / Math.tan(Math.min(v, h))));
}
// perspective aérienne : brume bleu nuit qui suit la caméra -> on sent les 1 600 m
const HAZE = new THREE.Color(0x14204a);
const PLASMA_T = { value: 0 };
scene.fog = new THREE.Fog(HAZE, 6, 40);
function updateHaze() {
  const d = camera.position.distanceTo(controls.target);
  scene.fog.near = Math.max(0.5, d - 5.0);
  scene.fog.far = d + 24;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ================================================================== fond discret */
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 48, 32), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vDir;
    float h(vec3 p){ p = fract(p*0.3183099+.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
    float n(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
      return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z); }
    float fbm(vec3 p){ float a=.5, s=0.; for(int i=0;i<6;i++){ s+=a*n(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }
    void main(){
      vec3 d = normalize(vDir);
      vec3 axis = normalize(vec3(0.55, 0.75, -0.35));
      float band = exp(-pow(dot(d, axis) * 1.8, 2.0));
      float neb = band * smoothstep(.32, .82, fbm(d * 3.2));
      float dust = fbm(d * 6.5 + 4.0);
      vec3 col = vec3(.004,.007,.016);
      float hue = fbm(d * 2.1 + 7.0);
      vec3 pc = mix(vec3(.08,.16,.62), vec3(.38,.10,.62), smoothstep(.35,.7,hue));
      col += pc * neb * .55;
      col += mix(vec3(.25,.45,1.0), vec3(.70,.30,1.0), smoothstep(.4,.7,hue)) * pow(neb, 2.4) * .55;
      col *= 1.0 - .7 * smoothstep(.45, .75, dust) * band;
      col += vec3(.40,.20,.08) * band * pow(smoothstep(.62,.9, fbm(d*9.0+11.0)), 2.0) * .18;
      gl_FragColor = vec4(col, 1.0);
    }`
}));
scene.add(sky);
function starField(count, radius, size) {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    pos.set([radius * s * Math.cos(t), radius * u, radius * s * Math.sin(t)], i * 3);
    const k = Math.random();
    c.setRGB(...(k > .92 ? [1, .8, .6] : k > .7 ? [.78, .86, 1] : [1, 1, 1])).multiplyScalar(.25 + Math.random() * .6);
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ size, sizeAttenuation: false, vertexColors: true, depthWrite: false, fog: false }));
}
scene.add(starField(3000, 280, 1.2), starField(220, 280, 2.2));
const DUST_N = 1100, DUST_BOX = 40;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_N * 3);
for (let i = 0; i < DUST_N; i++) dustPos.set([(Math.random() - .5) * DUST_BOX, (Math.random() - .5) * DUST_BOX * .6, (Math.random() - .5) * DUST_BOX], i * 3);
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ size: 0.028, sizeAttenuation: true, color: 0x8ea4c8, transparent: true, opacity: .45, depthWrite: false, fog: false, map: (() => { const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d'); const r = g.createRadialGradient(16, 16, 0, 16, 16, 16); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.4, 'rgba(255,255,255,.5)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 32, 32); return new THREE.CanvasTexture(c); })() }));
scene.add(dust);

/* ================================================================== navettes d'escorte : repères d'échelle (~35 m) */
const escorts = [];
{
  const k = 22 * V * S;                                // longueur d'une navette en unités
  const hullM = new THREE.MeshStandardMaterial({ color: 0x8a96a6, roughness: .35, metalness: .6 });
  const wingM = new THREE.MeshStandardMaterial({ color: 0x2a3038, roughness: .4, metalness: .6 });
  const EX = [[ 1, 2.2,  0.4, 0.7, 0.0], [ 1, 3.1, -0.5, 0.5, 4.5], [ 1, 1.7,  0.9, 0.6, 9.0],
              [-1, 2.6,  0.2, 0.65, 2.0], [-1, 3.4, -0.7, 0.45, 6.5], [-1, 1.9,  1.0, 0.55, 11.0]];
  for (const [side, off, y, sp, ph] of EX) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(k * .28, k * .16, k * .8), hullM); g.add(body);
    const nose = new THREE.Mesh(new THREE.ConeGeometry(k * .12, k * .3, 8), hullM); nose.rotation.x = Math.PI / 2; nose.position.z = k * .55; g.add(nose);
    const wing = new THREE.Mesh(new THREE.BoxGeometry(k * .95, k * .03, k * .32), wingM); wing.position.z = -k * .12; g.add(wing);
    const fx = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0x9cc4ff, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: .8 }));
    fx.scale.setScalar(k * .5); fx.position.z = -k * .48; g.add(fx);
    g.userData = { x: side * (1.6 + off), y, sp, ph, fx };
    if (ORBIT) continue;
    scene.add(g); escorts.push(g);
  }
}

/* ================================================================== lumière : soleil de face */
const ship = new THREE.Group();
scene.add(ship);
const SUN_DIR = new THREE.Vector3(-0.42, 0.10, 0.90).normalize();
const key = new THREE.DirectionalLight(0xfff0dc, 3.0);
key.position.copy(SUN_DIR).multiplyScalar(14);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 40 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.015;
key.target = ship;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9db8e8, 1.3); rim.position.set(-9, 4, -10); scene.add(rim);
const fill = new THREE.DirectionalLight(0xb8c6e8, 1.15); fill.position.set(3, 10, -4); scene.add(fill);
scene.add(new THREE.HemisphereLight(0x2c3a58, 0x05060a, 0.8));
const engineLight = new THREE.PointLight(0xff7a2a, 0, 12, 1.6);
engineLight.position.set(0, 0, (NOZZLE_Z - 40) * S);
ship.add(engineLight);
const engineLights = NOZZLES.map((nz) => {   // une lueur par tuyère, sinon seule celle du centre semble allumée
  const l = new THREE.PointLight(0xff7a2a, 0, nz.r * S * 9, 1.7); l.position.set(nz.x * S, nz.y * S, (nz.z - 30) * S); ship.add(l); return l;
});

/* ================================================================== lookdev procédural (sans UV) */
// Atelier des logos : peinture chargée seulement avec ?lg=1 (vaisseau possédé ou croisé), jamais au catalogue
const LOGO = /[?&]lg=1/.test(location.search) ? (await import('./logo-paint.js?v=20261103b')).createLogoPaint(THREE, 'bernard') : null;
const LOOK = {
  M_FD_PLATE:  { cell: [5.0, 3.6], seam: .20, depth: .30, tint: .22, rough: .18, grime: .42, wear: .60 },
  M_FD_PLATE2: { cell: [5.0, 3.6], seam: .20, depth: .30, tint: .22, rough: .18, grime: .46, wear: .55 },
  M_FD_MUZZLE: { cell: [4.5, 3.2], seam: .20, depth: .30, tint: .20, rough: .16, grime: .40, wear: .65 },
  M_FD_HULL:   { cell: [10.0, 7.0], seam: .18, depth: .20, tint: .12, rough: .16, grime: .22, wear: .30 },
  M_FD_MECH:   { cell: [7.0, 5.0], seam: .16, depth: .20, tint: .14, rough: .16, grime: .26, wear: .38 },
  M_FD_STEEL:  { cell: [6.0, 4.0], seam: .12, depth: .10, tint: .06, rough: .10, grime: .18, wear: .40 },
  M_FD_HORN:   { cell: [3.6, 2.6], seam: .12, depth: .10, tint: .10, rough: .10, grime: .14, wear: .55 },
  M_FD_HORN2:  { cell: [3.6, 2.6], seam: .12, depth: .10, tint: .10, rough: .10, grime: .18, wear: .45 },
};
function premium(mat, p) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uCell = { value: new THREE.Vector2(...p.cell) };
    sh.uniforms.uLook = { value: new THREE.Vector4(p.seam, p.depth, p.tint, p.rough) };
    sh.uniforms.uLook2 = { value: new THREE.Vector2(p.grime, p.wear) };
    if (LOGO) Object.assign(sh.uniforms, LOGO.uni);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vOP; varying vec3 vON;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvOP = position; vON = normal;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vOP; varying vec3 vON;
        ${LOGO ? LOGO.DECL : ''}
        uniform vec2 uCell; uniform vec4 uLook; uniform vec2 uLook2;
        float hh(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float vn(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
          float a=hh(i.xy+i.z*17.0), b=hh(i.xy+vec2(1,0)+i.z*17.0), c=hh(i.xy+vec2(0,1)+i.z*17.0), d=hh(i.xy+vec2(1,1)+i.z*17.0);
          float a2=hh(i.xy+(i.z+1.0)*17.0), b2=hh(i.xy+vec2(1,0)+(i.z+1.0)*17.0), c2=hh(i.xy+vec2(0,1)+(i.z+1.0)*17.0), d2=hh(i.xy+vec2(1,1)+(i.z+1.0)*17.0);
          return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y), mix(mix(a2,b2,f.x),mix(c2,d2,f.x),f.y), f.z); }
        vec2 panel(vec2 uv, vec2 cell){
          vec2 c = uv / cell; float row = floor(c.y); c.x += hh(vec2(row, 3.1)) * .9; c.x *= .7 + .6 * hh(vec2(row, 9.7));
          vec2 id = floor(c); vec2 f = fract(c);
          if (hh(id + 7.3) > .55) { float sx = step(.5, f.x); id = id * 2.0 + vec2(sx, 0.0); f.x = fract(f.x * 2.0); }
          vec2 e = min(f, 1.0 - f) * cell; return vec2(min(e.x, e.y), hh(id));
        }
        float seamOf(vec2 uv, vec2 cell, float sw, out float pid){ vec2 r = panel(uv, cell); pid = r.y; return 1.0 - smoothstep(sw * .5, sw * 1.6, r.x); }
        float tri(vec2 cell, float sw, out float pid){
          vec3 w = pow(abs(normalize(vON)), vec3(4.0)); w /= (w.x + w.y + w.z);
          float p1, p2, p3;
          float sX = seamOf(vOP.zy, cell, sw, p1), sY = seamOf(vOP.xz, cell, sw, p2), sZ = seamOf(vOP.xy, cell, sw, p3);
          pid = p1 * w.x + p2 * w.y + p3 * w.z;
          return sX * w.x + sY * w.y + sZ * w.z;
        }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        ${LOGO ? LOGO.APPLY : ''}
        float mpp = length(fwidth(vOP));
        float cmin = min(uCell.x, uCell.y);
        float near = 1.0 - smoothstep(cmin / 22.0, cmin / 9.0, mpp);
        float farv = 1.0 - smoothstep(cmin * 3.5 / 30.0, cmin * 3.5 / 7.0, mpp);
        float pidF, pidC;
        float seamF = tri(uCell, uLook.x, pidF) * near;
        float seamC = tri(uCell * 3.5, uLook.x * 2.4, pidC) * farv;
        float seam = max(seamF, seamC * .85);
        float pid = mix(.5, pidF, near) * .45 + pidC * .55;
        vec3 op = vOP;

          ${LOGO ? LOGO.APPLY : ''}
          wR = (cell - 0.5) * 0.14 + grime * 0.15 - (vein + scr) * 0.25 + soot * 0.1;
          float lc = wh(floor(p / 3.1) + 17.0);
          wE = vec3(1.0, 0.55, 0.22) * step(0.9982, lc) * seam * 1.1 * uAmt;
        }`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = clamp(roughnessFactor + wR * uAmt, 0.42, 0.97);`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += wE;`);
  };
  mat.customProgramCacheKey = () => 'fd-worn2-' + mat.name;
}

function marbleMaterial(mat) {
  mat.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vMP;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvMP = position;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vMP; float mV, mS;
        float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
        float vn(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
          return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
                     mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }
        float fbm(vec3 p){ float a = 0.5, r = 0.0; for (int k = 0; k < 4; k++) { r += a * vn(p); p = p * 2.03 + 3.1; a *= 0.5; } return r; }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        {
          vec3 p = vMP;
          float n = fbm(p * 0.09);
          float v = 1.0 - abs(sin((p.x * 0.7 + p.y * 0.4 + p.z) * 0.045 + n * 9.0));
          mV = smoothstep(0.86, 0.99, v) * smoothstep(0.35, 0.6, fbm(p * 0.05 + 11.0));
          mS = smoothstep(0.58, 0.78, fbm(p * 0.28 + 5.0));
          diffuseColor.rgb *= (0.70 + 0.50 * n) * (1.0 + 0.9 * mV) * (1.0 - 0.45 * mS);
        }`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = clamp(roughnessFactor * (0.85 + 0.35 * fbm(vMP * 0.6)) - 0.14 * mV + 0.25 * mS, 0.30, 1.0);`);
  };
  mat.customProgramCacheKey = () => 'fd-marble-' + mat.name;
}

/* ================================================================== chargement du modèle (glb gzip + base64) */
const navMats = [], eyeMats = [];
const loader = new GLTFLoader();
const loadEl = document.getElementById('loader'), bar = document.getElementById('loadbar');
async function loadShip() {
  const res = await fetch('../3d/bm/bernard.glb.gz?v=20261102');
  if (!res.ok) throw new Error(res.status);
  const total = +res.headers.get('content-length') || 0;
  const reader = res.body.getReader(); const chunks = []; let got = 0;
  for (;;) {
    const { done, value } = await reader.read(); if (done) break;
    chunks.push(value); got += value.length;
    if (total) bar.style.width = Math.round(85 * got / total) + '%';
  }
  // Blackmarket (jeu) : .glb.gz binaire ; le serveur peut déjà l'avoir décompressé (Content-Encoding)
  const raw = new Uint8Array(await new Blob(chunks).arrayBuffer());
  const buf = (raw[0] === 0x1f && raw[1] === 0x8b)
    ? await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()
    : raw.buffer;
  bar.style.width = '100%';
  return new Promise((ok, ko) => loader.parse(buf, '', ok, ko));
}
loadShip().then((gltf) => {
  const m = gltf.scene;
  m.updateMatrixWorld(true);
  const toScene = new THREE.Matrix4().makeTranslation(0, 0, BOW_SCENE - BOW_GLTF * V).multiply(new THREE.Matrix4().makeScale(V, V, V));
  m.traverse(o => { if (o.isMesh) o.geometry.applyMatrix4(new THREE.Matrix4().multiplyMatrices(toScene, o.matrixWorld)); });
  m.traverse(o => { if (o !== m) { o.position.set(0, 0, 0); o.rotation.set(0, 0, 0); o.scale.set(1, 1, 1); } });
  m.scale.setScalar(S);
  m.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const mat of mats) {
      if (mat.userData.proj) continue;
      const DARK = { M_FD_HULL: 0.8 };
      if (DARK[mat.name] && !mat.userData.dk) { mat.userData.dk = 1; mat.color.multiplyScalar(DARK[mat.name]); }
      const gl = GLOSS[mat.name];
      mat.envMapIntensity = gl ? gl[2] : 0.35;
      if (gl) { mat.roughness = gl[0]; mat.metalness = gl[1]; }
      if (['M_FD_PROJ', 'M_FD_HORN', 'M_FD_HORN2', 'M_FD_PLATE', 'M_FD_PLATE2', 'M_FD_MUZZLE'].includes(mat.name) && !mat.userData.proj) { mat.userData.projK = mat.name === 'M_FD_PLATE2' ? 0.85 : 1.0; if (mat.name === 'M_FD_HORN' || mat.name === 'M_FD_MUZZLE') mat.userData.projBase = [0.62, 0.52, 0.40]; if (mat.name === 'M_FD_HORN2') mat.userData.projBase = [0.22, 0.19, 0.16]; }
      if ((mat.name === 'M_FD_PROJ' || mat.name === 'M_FD_HORN' || mat.name === 'M_FD_HORN2' || mat.name === 'M_FD_PLATE' || mat.name === 'M_FD_PLATE2' || mat.name === 'M_FD_MUZZLE') && !mat.userData.proj) { mat.userData.proj = 1; projMaterial(mat); if (LOGO) LOGO.wrap(mat); continue; }
      if (mat.name === 'M_FD_ARMOR' && !mat.userData.ar) { mat.userData.ar = 1; mat.color.setRGB(0.024, 0.025, 0.028); wornSteel(mat, 1.0); if (LOGO) LOGO.wrap(mat); }
      if (mat.name === 'M_FD_ARMORL' && !mat.userData.ar) { mat.userData.ar = 1; mat.color.setRGB(0.032, 0.031, 0.030); wornSteel(mat, 1.0); if (LOGO) LOGO.wrap(mat); }
      if (mat.name === 'M_FD_SNOUT' && !mat.userData.ar) { mat.userData.ar = 1; mat.color.setRGB(0.30, 0.25, 0.19); mat.roughness = 0.52; mat.metalness = 0.5; mat.envMapIntensity = 0.45; wornSteel(mat, 0.75, [0.55, 0.47, 0.36], 0.6); }
      if (mat.name === 'M_FD_VOID') { mat.color.setRGB(0, 0, 0); mat.roughness = 1; mat.metalness = 0; mat.envMapIntensity = 0; }
      const look = LOOK[mat.name];
      if (look && !mat.userData.bm) { mat.userData.bm = 1; premium(mat, look); if (LOGO) LOGO.wrap(mat); }
      if (mat.name === 'M_KV_GLOW_MOTEUR') { mat.emissive.setRGB(1.0, 0.34, 0.10); mat.emissiveIntensity = ORBIT ? 0.12 : 1.25; mat.color.setRGB(ORBIT ? 0.12 : 0.6, ORBIT ? 0.05 : 0.15, 0.05); }   // orbite : tuyères froides, une braise
      else if (mat.name === 'M_FD_LIGHT') { mat.emissive.setRGB(1.0, 0.70, 0.38); mat.emissiveIntensity = 2.4; }
      else if (mat.name === 'M_FD_EYE') { mat.emissive.setRGB(1.0, 0.16, 0.08); mat.emissiveIntensity = 4.5; mat.color.setRGB(0.6, 0.02, 0.01); eyeMats.push(mat); }
      else if (mat.name === 'M_FD_CABINL') { mat.emissive.setRGB(1.0, 0.55, 0.25); mat.emissiveIntensity = 0.35; }
      else if (mat.name === 'M_FD_CABIN') { mat.emissive.setRGB(0, 0, 0); mat.emissiveIntensity = 0; mat.color.setRGB(0.07, 0.05, 0.035); mat.roughness = 0.9; mat.metalness = 0.1; }
      else if (mat.name === 'M_FD_EYEDIM') { mat.emissive.setRGB(0.8, 0.02, 0.01); mat.emissiveIntensity = 0.5; mat.color.setRGB(0.15, 0.01, 0.01); }
      else if (mat.name === 'M_FD_RED') { mat.emissive.setRGB(1.0, 0.04, 0.02); mat.emissiveIntensity = 1.3; }
      else if (mat.name.startsWith('M_KV_NAV_') || mat.name === 'M_KV_STROBE') { if (!navMats.includes(mat)) navMats.push(mat); }
    }
  });
  ship.add(m);
  const occ = m.clone(true);
  const depthOnly = new THREE.MeshBasicMaterial({ colorWrite: false });
  occ.traverse(o => { if (o.isMesh) { o.material = depthOnly; o.castShadow = o.receiveShadow = false; } });
  fxShip.add(occ);
  if (!ORBIT) { engineLight.intensity = 2.5; for (const l of engineLights) l.intensity = 3.0; }
  loadEl.classList.add('done');
}).catch((e) => {
  console.error(e);
  document.getElementById('loadtxt').innerHTML = '<div class="err">Le modèle n’a pas pu être chargé. Recharge la page pour réessayer.</div>';
});

/* ================================================================== caméra : orbite + pincer */
const TARGET = new THREE.Vector3(0, 0.0, innerWidth / innerHeight < 0.8 ? 0.9 : 1.4);
{
  const d = location.hash.includes('near') ? 3.6 : fitDistance();
  camera.position.copy(TARGET).add(new THREE.Vector3(0.62, 0.28, 0.73).normalize().multiplyScalar(d));
  if (location.hash.includes('proue')) camera.position.set(0.9, 0.35, BOW_SCENE * S + 4.2);   // face au mufle
  if (location.hash.includes('flanc')) camera.position.set(4.6, 1.4, BOW_SCENE * S + 2.6);    // 3/4 avant
  if (location.hash.includes('poupe')) camera.position.set(15.0, 3.0, NOZZLE_Z * S - 4.0);     // 3/4 arrière
}
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.rotateSpeed = 0.55; controls.zoomSpeed = 0.9;
controls.minDistance = 0.9;
controls.maxDistance = fitDistance() * 1.6;
controls.minPolarAngle = Math.PI * 0.10;
controls.maxPolarAngle = Math.PI * 0.86;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_ROTATE };
controls.autoRotate = !REDUCED; controls.autoRotateSpeed = 0.3;
controls.update();
if (LOGO) LOGO.attach({ renderer, camera, controls, S });
// Vue héros du jeu (ambassade, fiche de mission) : les gestes faits sur la fiche sont relayés ici par postMessage
addEventListener('message', (ev) => {
  if (ev.origin !== location.origin || !ev.data) return;
  const d = ev.data;
  if (d.bmGesture === 'begin') { controls.autoRotate = false; hint.classList.add('gone'); clearTimeout(idleTimer); }
  if (d.bmGesture === 'end') { clearTimeout(idleTimer); if (!REDUCED) idleTimer = setTimeout(() => { controls.autoRotate = true; }, 6000); }
  if (d.bmOrbit || d.bmDolly) {
    const off = camera.position.clone().sub(controls.target);
    if (d.bmOrbit) {
      const sph = new THREE.Spherical().setFromVector3(off), k = 2 * Math.PI * controls.rotateSpeed / Math.max(1, renderer.domElement.clientHeight);
      sph.theta -= d.bmOrbit[0] * k; sph.phi -= d.bmOrbit[1] * k;
      sph.phi = Math.max(controls.minPolarAngle, Math.min(controls.maxPolarAngle, sph.phi)); sph.makeSafe();
      off.setFromSpherical(sph);
    }
    if (d.bmDolly) off.setLength(Math.max(controls.minDistance, Math.min(controls.maxDistance, off.length() * d.bmDolly)));
    camera.position.copy(controls.target).add(off); camera.lookAt(controls.target);
  }
});
let idleTimer = null;
const hint = document.getElementById('hint');
controls.addEventListener('start', () => { controls.autoRotate = false; hint.classList.add('gone'); clearTimeout(idleTimer); });
controls.addEventListener('end', () => {
  clearTimeout(idleTimer);
  if (!REDUCED) idleTimer = setTimeout(() => { controls.autoRotate = true; }, 6000);
});

/* ================================================================== post-traitement */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.updateGtaoMaterial({ radius: 0.22, distanceExponent: 1.4, thickness: 1.2, scale: 1.15, samples: 12 });
gtao.blendIntensity = 0.85;
composer.addPass(gtao);
const fxPass = new RenderPass(fxScene, camera); fxPass.clear = false; fxPass.clearDepth = true;
composer.addPass(fxPass);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.7, 0.45, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; fitDistance.cached = 0; controls.maxDistance = fitDistance() * 1.6;
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  bloom.resolution.set(innerWidth / 2, innerHeight / 2);
 
});

/* ================================================================== boucle */
const clock = new THREE.Clock();
const SPEED = ORBIT ? 0.12 : 9;
let frames = 0, perfT = 0, perfChecked = false;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const amp = REDUCED ? 0.25 : ORBIT ? 0.5 : 1;
  ship.position.y = Math.sin(t * 0.45) * 0.05 * amp;
  ship.rotation.z = Math.sin(t * 0.32) * 0.012 * amp;
  ship.rotation.x = Math.sin(t * 0.27 + 1.0) * 0.006 * amp;
  for (const m of plumeMats) m.uniforms.uTime.value = t;
  PLASMA_T.value = t;
  if (!ORBIT) updateSmoke(t);
  fxShip.position.copy(ship.position); fxShip.rotation.copy(ship.rotation);
  shockLight.intensity = ORBIT ? 0 : 0.4 * (0.9 + 0.1 * Math.sin(t * 7.0));
  if (engineLight.intensity > 0) { const f = 0.90 + 0.10 * Math.sin(t * 29.0) * Math.sin(t * 7.3); engineLight.intensity = 2.5 * f; engineLights.forEach((l, i) => { l.intensity = 3.0 * (0.9 + 0.1 * Math.sin(t * 23.0 + i * 1.7)); }); }
  for (const m of eyeMats) m.emissiveIntensity = 4.0 + 2.2 * Math.pow(0.5 + 0.5 * Math.sin(t * 1.3), 3.0);
  for (const m of navMats) {
    const strobe = m.name === 'M_KV_STROBE';
    m.emissiveIntensity = strobe ? ((t % 2.2) < 0.08 ? 12 : 0.2) : 2.5 + 2.0 * (0.5 + 0.5 * Math.sin(t * 2.4));
  }
  const p = dustGeo.attributes.position.array;
  for (let i = 0; i < DUST_N; i++) {
    let z = p[i * 3 + 2] - SPEED * dt;
    if (z < -DUST_BOX / 2) z += DUST_BOX;
    p[i * 3 + 2] = z;
  }
  dustGeo.attributes.position.needsUpdate = true;
  if (!perfChecked && navMats.length && location.hash !== '#hq') {
    frames++; perfT += dt;
    if (perfT > 2.5) {
      const fps = frames / perfT; perfChecked = true;
      if (fps < 40) gtao.enabled = false;
      if (fps < 24) renderer.setPixelRatio(1);
    }
  }
  for (const e of escorts) {
    const u = e.userData;
    e.position.set(u.x, u.y + Math.sin(t * .4 + u.ph) * .08, ((t * u.sp + u.ph) % 14) - 7);
    e.rotation.z = Math.sin(t * .5 + u.ph) * .12;
  }
  {   // vue perspective : grand-angle et pivot qui glisse le long de la coque quand on s'approche
    const fit = fitDistance();
    const d = camera.position.distanceTo(controls.target);
    const k = THREE.MathUtils.smoothstep(d, controls.minDistance, 0.85 * fit);
    const fov = THREE.MathUtils.lerp(WIDE_FOV(), BASE_FOV(), k);
    if (Math.abs(fov - camera.fov) > 0.05) { camera.fov = fov; camera.updateProjectionMatrix(); }
    const STERN = (BOW_SCENE - 1310 * V) * S, BOW = BOW_SCENE * S;
    const wantZ = THREE.MathUtils.lerp(THREE.MathUtils.clamp(camera.position.z * 0.8, STERN, BOW), TARGET.z, k);
    const wantY = THREE.MathUtils.lerp(AXIS_Y + 0.05, TARGET.y, k);
    const a = Math.min(1, dt * 2.5);
    const dz = (wantZ - controls.target.z) * a, dy = (wantY - controls.target.y) * a;
    controls.target.z += dz; controls.target.y += dy;
    camera.position.z += dz; camera.position.y += dy;
  }
  controls.update();
  updateHaze();
  composer.render();
  requestAnimationFrame(frame);
}
frame();
</script>
