<style>
/* Layout : vue 3D plein écran (fiche d'unité Starbyte), HUD minimal en surimpression. Monde unique sombre. */
:root {
  --space: #0b0f12;
  --ink: #e8ecf1;
  --ink-dim: #8a96a6;
  --amber: #f0a040;
  --hull-red: #b3262a;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--space); color: var(--ink);
  font-family: var(--font-display); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; }
.hud {
  position: fixed; left: 0; right: 0; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud-top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 18px); padding-bottom: 48px;
  background: linear-gradient(to bottom, rgba(2,4,9,.72), rgba(2,4,9,0)); }
.hud-bottom { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); padding-top: 48px;
  background: linear-gradient(to top, rgba(2,4,9,.75), rgba(2,4,9,0)); }
.eyebrow { font-family: var(--font-data); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-dim); display: flex; align-items: center; gap: 8px; }
.eyebrow::before { content: ""; width: 14px; height: 3px; background: var(--hull-red); }
.name { font-weight: 600; font-size: clamp(34px, 9vw, 56px); line-height: 1; letter-spacing: -.01em; margin: 8px 0 4px; text-wrap: balance; }
.class { font-family: var(--font-data); font-size: 13px; color: var(--ink-dim); }
.specs { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 0; padding: 0; list-style: none;
  font-family: var(--font-data); font-size: 12px; font-variant-numeric: tabular-nums; }
.specs li { display: flex; gap: 6px; align-items: baseline; }
.specs span.k { color: var(--ink-dim); text-transform: uppercase; letter-spacing: .1em; font-size: 10px; }
.specs b { color: var(--ink); font-weight: 500; }
.specs b.amber { color: var(--amber); }
.hint { margin-top: 14px; font-family: var(--font-data); font-size: 11px; color: var(--ink-dim); letter-spacing: .06em; transition: opacity .8s ease; }
.hint.gone { opacity: 0; }
.loader { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-family: var(--font-data); font-size: 12px; color: var(--ink-dim); letter-spacing: .1em; transition: opacity .6s ease; }
.loader.done { opacity: 0; }
.bar { width: 160px; height: 2px; background: rgba(255,255,255,.08); margin-top: 10px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .2s; }
.err { color: var(--amber); max-width: 30ch; text-align: center; line-height: 1.5; }
@media (prefers-reduced-motion: reduce) { .hint, .loader { transition: none; } }
</style>

{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createOrbitSky, forwardFrom } from '../3d/sky/orbitsky.js?v=20261103e';   // fond orbital partagé (03/11)

/* ================================================================== réglages */
const S = 0.01;                                   // 1 unité = 100 m de scène
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ENGINE_COLOR = new THREE.Color(0.62, 0.80, 1.0);   // plasma bleu-blanc
// Le Requiem (1 000 m) au gabarit de scène KV-01 : V = 1,15 m de scène par m réel, proue (z glTF = +500 m) sur z = 600.
const V = 1.15, BOW_GLTF = 500, BOW_SCENE = 600;
const EX = 36.1, EZ1 = 32.9, EZ2 = 4.3, ER = 9.3;   // réacteurs 3 × 2 (m réels)
const NOZZLES = [];
for (const x of [-EX, 0, EX]) for (const y of [EZ1, EZ2]) NOZZLES.push({ x: x * V, y: y * V, r: ER * V, z: BOW_SCENE - (x === 0 ? 1000 : 991.5) * V });
const GLOSS = {
  M_RQ_BLANC: [0.34, 0.0], M_RQ_BLANC_SALE: [0.40, 0.05], M_RQ_ROUGE: [0.28, 0.3],
  M_KV_GUNMETAL: [0.26, 0.85], M_KV_STRUCT_BLACK: [0.30, 0.55], M_TK_GRAPHITE: [0.30, 0.6], M_RQ_LAITON: [0.30, 0.9],
}, GLOSS_ENV = 0.9;
const AXIS_Y = 0.24;                              // centre vertical de la coque (unités de scène)

/* ================================================================== moteur de rendu */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010207);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 600);
function fitDistance() {
  camera.fov = camera.aspect < 0.8 ? 54 : 40; camera.updateProjectionMatrix();
  const v = THREE.MathUtils.degToRad(camera.fov) / 2;
  const h = Math.atan(Math.tan(v) * camera.aspect);
  const half = camera.aspect < 0.8 ? 4.7 : 5.0;
  return Math.max(8.5, half / Math.tan(Math.min(v, h)));
}
const HAZE = new THREE.Color(0x14204a);
const PLASMA_T = { value: 0 };
scene.fog = new THREE.Fog(HAZE, 6, 40);
function updateHaze() {
  const d = camera.position.distanceTo(controls.target);
  scene.fog.near = Math.max(0.5, d - 5.0);
  scene.fog.far = d + 22;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ================================================================== fond */
// Fond orbital partagé (photographie spatiale : planète immense, soleil chaud haut-gauche, étoiles rares) — orienté sur la vue de départ
const ORBIT_SKY = createOrbitSky(THREE, { forward: forwardFrom([0.55, 0.26, -0.8]), dim: 1 / renderer.toneMappingExposure });
scene.add(ORBIT_SKY.mesh);
function starField(count, radius, size) {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    pos.set([radius * s * Math.cos(t), radius * u, radius * s * Math.sin(t)], i * 3);
    const k = Math.random();
    c.setRGB(...(k > .92 ? [1, .8, .6] : k > .7 ? [.78, .86, 1] : [1, 1, 1])).multiplyScalar(.25 + Math.random() * .6);
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ size, sizeAttenuation: false, vertexColors: true, depthWrite: false, fog: false }));
}
// (étoiles : dans le fond orbital)
const DUST_N = 1100, DUST_BOX = 40;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_N * 3);
for (let i = 0; i < DUST_N; i++) dustPos.set([(Math.random() - .5) * DUST_BOX, (Math.random() - .5) * DUST_BOX * .6, (Math.random() - .5) * DUST_BOX], i * 3);
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ size: 0.028, color: 0x8ea4c8, transparent: true, opacity: .45, depthWrite: false, fog: false, sizeAttenuation: true }));
scene.add(dust);

/* ================================================================== repères d'échelle : navettes d'escorte (~35 m)
   De minuscules appareils longent le croiseur : à côté d'eux, ses 1 000 m se lisent d'un coup d'œil. */
const escorts = [];
{
  const hullM = new THREE.MeshStandardMaterial({ color: 0x9a968e, roughness: .4, metalness: .5 });
  const darkM = new THREE.MeshStandardMaterial({ color: 0x2a2d33, roughness: .35, metalness: .7 });
  const tailM = new THREE.SpriteMaterial({ map: null, color: 0x9cc0ff, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: .9 });
  const L = 0.40, W = 0.14;                                      // ≈ 35 m × 12 m en unités de scène
  for (const [x, y, z, sp] of [[1.55, 0.55, 2.5, .55], [1.75, 0.35, 1.9, .55], [-2.1, -0.35, -1.0, .38], [-1.9, -0.55, -1.6, .38], [2.8, 1.1, -3.5, .30], [-3.4, 0.9, 4.0, .26]]) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(W, W * .38, L), hullM);
    const wing = new THREE.Mesh(new THREE.BoxGeometry(W * 2.2, W * .1, L * .35), darkM); wing.position.z = -L * .12;
    const nose = new THREE.Mesh(new THREE.ConeGeometry(W * .36, L * .3, 6), hullM); nose.rotation.x = Math.PI / 2; nose.position.z = L * .62;
    const glow = new THREE.Sprite(tailM.clone()); g.userData.glow = glow; glow.scale.setScalar(W * 1.6); glow.position.z = -L * .55;
    g.add(body, wing, nose, glow);
    g.position.set(x, y + AXIS_Y, z);
    Object.assign(g.userData, { x, y: y + AXIS_Y, z0: z, sp, ph: Math.random() * 6 });
    scene.add(g); escorts.push(g);
  }
}

/* ================================================================== lumière */
const ship = new THREE.Group();
scene.add(ship);
const SUN_DIR = ORBIT_SKY.sunDir.clone();   // le soleil du fond : haut-gauche de la vue de départ
const key = new THREE.DirectionalLight(0xffe3c2, 3.2);   // blanc doré
key.position.copy(SUN_DIR).multiplyScalar(14);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 40 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.015;
key.target = ship;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9db8e8, 1.3); rim.position.set(-9, 4, -10); scene.add(rim);
const fill = new THREE.DirectionalLight(0xb8c6e8, 0.8); fill.position.set(3, 10, -4); scene.add(fill);
scene.add(new THREE.HemisphereLight(0x1a2238, 0x2a3a58, 0.55));
{ const bounce = new THREE.DirectionalLight(0xa9c4f0, 0.9); bounce.position.set(1, -10, 2); scene.add(bounce); }   // rebond bleuté de la planète et de son atmosphère, par en dessous
const engineLight = new THREE.PointLight(0x80a8ff, 0, 10, 1.7);
engineLight.position.set(0, AXIS_Y, (NOZZLES[0].z - 40) * S);
ship.add(engineLight);

/* ================================================================== lookdev : la planche donne la peinture,
   le shader ajoute micro-panneaux de près, variation de rugosité, patine, suie vers les moteurs, usure d'arête. */
// Atelier des logos : peinture chargée seulement avec ?lg=1 (vaisseau possédé ou croisé), jamais au catalogue
const LOGO = /[?&]lg=1/.test(location.search) ? (await import('./logo-paint.js?v=20261102d')).createLogoPaint(THREE, 'requiem') : null;
const LOOK = {
  M_RQ_BLANC:        { cell: [9.0, 6.0], seam: .13, depth: .05, tint: .04, rough: .10, grime: .16, wear: .25 },
  M_RQ_BLANC_SALE:   { cell: [9.0, 6.0], seam: .13, depth: .05, tint: .05, rough: .10, grime: .20, wear: .25 },
  M_RQ_ROUGE:        { cell: [8.0, 5.0], seam: .13, depth: .10, tint: .05, rough: .10, grime: .18, wear: .30 },
  M_KV_GUNMETAL:     { cell: [6.0, 4.0], seam: .14, depth: .30, tint: .06, rough: .14, grime: .14, wear: .40 },
  M_KV_STRUCT_BLACK: { cell: [15.0, 8.5], seam: .18, depth: .10, tint: .10, rough: .18, grime: .10, wear: .25 },
  M_TK_GRAPHITE:     { cell: [12.0, 8.0], seam: .16, depth: .15, tint: .08, rough: .16, grime: .12, wear: .30 },
};
function premium(mat, p) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uCell = { value: new THREE.Vector2(...p.cell) };
    sh.uniforms.uLook = { value: new THREE.Vector4(p.seam, p.depth, p.tint, p.rough) };
    sh.uniforms.uLook2 = { value: new THREE.Vector2(p.grime, p.wear) };
    if (LOGO) Object.assign(sh.uniforms, LOGO.uni);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vOP; varying vec3 vON;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvOP = position; vON = normal;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vOP; varying vec3 vON;
        uniform vec2 uCell; uniform vec4 uLook; uniform vec2 uLook2;
        ${LOGO ? LOGO.DECL : ''}
        float hh(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float vn(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
          float a=hh(i.xy+i.z*17.0), b=hh(i.xy+vec2(1,0)+i.z*17.0), c=hh(i.xy+vec2(0,1)+i.z*17.0), d=hh(i.xy+vec2(1,1)+i.z*17.0);
          float a2=hh(i.xy+(i.z+1.0)*17.0), b2=hh(i.xy+vec2(1,0)+(i.z+1.0)*17.0), c2=hh(i.xy+vec2(0,1)+(i.z+1.0)*17.0), d2=hh(i.xy+vec2(1,1)+(i.z+1.0)*17.0);
          return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y), mix(mix(a2,b2,f.x),mix(c2,d2,f.x),f.y), f.z); }
        vec2 panel(vec2 uv, vec2 cell){
          vec2 c = uv / cell; float row = floor(c.y); c.x += hh(vec2(row, 3.1)) * .9; c.x *= .7 + .6 * hh(vec2(row, 9.7));
          vec2 id = floor(c); vec2 f = fract(c);
          if (hh(id + 7.3) > .55) { float sx = step(.5, f.x); id = id * 2.0 + vec2(sx, 0.0); f.x = fract(f.x * 2.0); }
          vec2 e = min(f, 1.0 - f) * cell; return vec2(min(e.x, e.y), hh(id));
        }
        float seamOf(vec2 uv, vec2 cell, float sw, out float pid){ vec2 r = panel(uv, cell); pid = r.y; return 1.0 - smoothstep(sw * .5, sw * 1.6, r.x); }
        float tri(vec2 cell, float sw, out float pid){
          vec3 w = pow(abs(normalize(vON)), vec3(4.0)); w /= (w.x + w.y + w.z);
          float p1, p2, p3;
          float sX = seamOf(vOP.zy, cell, sw, p1), sY = seamOf(vOP.xz, cell, sw, p2), sZ = seamOf(vOP.xy, cell, sw, p3);
          pid = p1 * w.x + p2 * w.y + p3 * w.z;
          return sX * w.x + sY * w.y + sZ * w.z;
        }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        ${LOGO ? LOGO.APPLY : ''}
        float mpp = length(fwidth(vOP));
        float cmin = min(uCell.x, uCell.y);
        float near = 1.0 - smoothstep(cmin / 22.0, cmin / 9.0, mpp);
        float pidF;
        float seam = tri(uCell, uLook.x, pidF) * near;
        float pid = mix(.5, pidF, near);
        vec3 op = vOP;
        float grime = vn(op * .018) * .5 + vn(op * .07) * .3 + vn(op * .3) * .2;
        float streak = vn(vec3(op.x * .35, op.y * .35, op.z * .012)) * vn(vec3(op.x * 1.1, op.y * 1.1, op.z * .04));
        float soot = smoothstep(-380.0, -560.0, op.z) * (.55 + .45 * vn(op * .05));
        float low = smoothstep(.2, -.8, normalize(vON).y);
        vec3 fw = fwidth(normalize(vON)); float edge = clamp(length(fw) * 6.0, 0.0, 1.0) * near;
        diffuseColor.rgb *= (1.0 - uLook.z * .5) + uLook.z * pid;
        diffuseColor.rgb *= 1.0 - .22 * seam;
        float dirt = clamp(uLook2.x * (grime * 1.5 + low * .8) + .35 * smoothstep(.2, .7, streak) + .55 * soot, 0.0, .8);
        diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(.55, .50, .45), dirt);
        diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * 1.5 + .03, edge * uLook2.y * .4);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = clamp(roughnessFactor + uLook.w * (pid - .5) + .2 * seam + .22 * dirt - .1 * edge * uLook2.y, .05, 1.0);`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        {
          float hgt = -seam * uLook.y * .22;
          vec3 sp = -vViewPosition; vec3 dpdx = dFdx(sp), dpdy = dFdy(sp);
          float dhx = dFdx(hgt), dhy = dFdy(hgt);
          vec3 r1 = cross(dpdy, normal), r2 = cross(normal, dpdx);
          float det = dot(dpdx, r1);
          vec3 grad = sign(det) * (dhx * r1 + dhy * r2);
          normal = normalize(abs(det) * normal - grad);
        }`);
  };
  mat.customProgramCacheKey = () => 'rq-premium-' + mat.name;
}

/* ================================================================== panaches (6 réacteurs plasma) */
const plumeMat = (color, alpha, flick, layer) => new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(color) }, uAlpha: { value: alpha }, uFlick: { value: flick }, uLayer: { value: layer } },
  vertexShader: `varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position,1.0);
      vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform float uTime, uAlpha, uFlick, uLayer; uniform vec3 uColor; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    float hh(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(hh(i),hh(i+vec2(1,0)),f.x),mix(hh(i+vec2(0,1)),hh(i+vec2(1,1)),f.x),f.y); }
    void main(){
      float t = vUv.y;
      float along = pow(t, 1.25 + uLayer * .9) * smoothstep(0.0, .12, t);
      float core = pow(abs(dot(normalize(vN), normalize(vV))), 1.2 + uLayer);
      vec2 q = vec2(vUv.x * 6.0, vUv.y * 9.0 - uTime * 7.0);
      float turb = .72 + .28 * vn(q) * uFlick + .12 * vn(q * 2.7 + 5.0);
      float diamonds = .78 + .22 * pow(.5 + .5 * sin(t * 46.0 - uTime * 3.0), 3.0) * (1.0 - uLayer * .6) * smoothstep(.35, .9, t);
      float a = uAlpha * along * core * turb * diamonds;
      vec3 c = mix(uColor * vec3(.75, .8, 1.15), uColor, t);
      gl_FragColor = vec4(c * a, a);

    camera.position.z += dz * Math.min(1, dt * 2.5); camera.position.y += dy * Math.min(1, dt * 2.5);
  }
  for (const e of escorts) {                        // les navettes doublent lentement le croiseur puis reviennent
    const u = e.userData;
    let z = u.z0 + ((t * u.sp + u.ph) % 14) - 7;
    e.position.set(u.x + Math.sin(t * .3 + u.ph) * .05, u.y + Math.sin(t * .4 + u.ph) * .04, z);
  }
  controls.update();
  updateHaze();
  composer.render();
  requestAnimationFrame(frame);
}
if (LOGO) LOGO.attach({ renderer, camera, controls, S });
frame();
</script>
