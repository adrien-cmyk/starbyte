<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';

/* ════════════════════════════════════════════════════════════════════════════════════════
   TAXI — trois séquences pilotables : départ · voyage (boucle) · arrivée.
   Pilotage : ?phase=depart|voyage|arrivee  (départ enchaîne sur le voyage sauf &only)
              postMessage({ taxiCmd: 'play', phase }) · { taxiCmd: 'arrive' } (sortie du voyage → arrivée)
              { taxiCmd: 'cfg', cfg: {...} }  ·  ?cfg=<json>  ·  window.TAXI_CINE
   Événements envoyés au parent : { taxiCine: 1, type: 'ready' | 'phase' | 'beat' | 'done', ... }
   ════════════════════════════════════════════════════════════════════════════════════════ */

/* ═══════════════ RÉGLAGES ESSENTIELS ═══════════════ */
const CFG = {
  rate: 1,                          // vitesse de lecture globale
  distortion: 1,                    // intensité des distorsions (lentille, coque, image)
  portalRadius: 6.2,                // rayon du passage ouvert (le TAXI : 11,5 u de long, 3,9 u de rayon)
  ship: { cruise: 0.7, plunge: 4.6, emerge: 15.0, recall: 18.0 },   // u/s : dérive, plongée, sortie, rappel
  jaw: { base: 32, tip: 22, teeth: 170, delay: 0.55 },             // ouverture des pinces (°), dégagement des crocs, décalage
  release: { to: [1.2, 3.5, 10.0], dur: 6.5, start: 9.0 },         // trajectoire de libération (repère du vaisseau), durée, début
  spaghetti: { depart: 6.0, burst: 9.0, recall: 4.0, voyage: 0.9 },  // étirement de la proue à la poupe (× longueur)
  T: { suckAt: 4.0, suckDur: 0.45, loop: 8, exit: 2.4, openAt: 1.3, burstAt: 1.75, burstDur: 0.12, settleDur: 3.0, rematDur: 1.1, jawsAt: 5.4, jawsDur: 3.8, recallAfter: 0.4, hold: 3.8 },
};
const Q = new URLSearchParams(location.search);
function deepMerge(a, b) { for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') deepMerge(a[k], b[k]); else a[k] = b[k]; } return a; }
try { if (Q.get('cfg')) deepMerge(CFG, JSON.parse(Q.get('cfg'))); } catch (e) { console.warn('cfg', e); }
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EMBED = Q.has('embed');

/* ═══════════════ outils ═══════════════ */
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const lin = (a, b, x) => clamp01((x - a) / (b - a));
const sm = (a, b, x) => { const t = lin(a, b, x); return t * t * (3 - 2 * t); };
const eio = (u) => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eoS = (u) => Math.sin(u * Math.PI / 2);
const eiC = (u) => u * u * u;
const hash = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const smInt = (t, a, b) => t <= a ? 0 : t >= b ? (b - a) * .5 + (t - b) : (b - a) * (Math.pow((t - a) / (b - a), 3) - Math.pow((t - a) / (b - a), 4) / 2);
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
function post(m) { try { if (parent !== window) parent.postMessage(Object.assign({ taxiCine: 1 }, m), '*'); } catch (e) {} }

/* ═══════════════ moteur ═══════════════ */
const stage = document.getElementById('stage');
const CAPTURE = new URLSearchParams(location.search).has('capture');   // tournage image par image (bande-annonce)
let capDt = 1 / 30;
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE });
let PR = Math.min(devicePixelRatio, 1.6);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010207);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 900);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const PLASMA_T = { value: 0 };
const SUN_DIR = V3(0.05, 0.5, 0.86).normalize();
const NOISE_GLSL = `
  float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float n2(vec2 x){ vec2 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
    return mix(mix(h2(i), h2(i+vec2(1,0)), f.x), mix(h2(i+vec2(0,1)), h2(i+vec2(1,1)), f.x), f.y); }
  float f2(vec2 p){ float a = .5, s = 0.; for (int i = 0; i < 5; i++){ s += a * n2(p); p = p * 2.03 + 3.7; a *= .5; } return s; }
  float h3(vec3 p){ p = fract(p * vec3(.1031, .1030, .0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }
  float n3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
    return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z); }
  float f3(vec3 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*n3(p); p=p*2.02+3.1; a*=.5; } return s; }`;

/* ═══════════════ déformation réversible du vaisseau (et de sa planète tant qu'elle est à bord) ═══════════════
   Calculée dans le repère du vaisseau, appliquée au rendu, au masque de la lentille et aux ombres.
   La géométrie n'est jamais modifiée : à amplitude nulle, le TAXI est rigoureusement intact. */
const DEF = {
  uShip: { value: new THREE.Matrix4() }, uShipInv: { value: new THREE.Matrix4() },
  uDT: { value: 0 }, uDW: { value: Math.PI * 2 / CFG.T.loop },
  uSpag: { value: 0 }, uSpagL: { value: 3.2 }, uPlaneZs: { value: 0 }, uPlaneDir: { value: 1 },
  uWave: { value: 0 }, uStretch: { value: 0 }, uLag: { value: 0 }, uTwist: { value: 0 }, uBend: { value: 0 },
  uG: { value: 0 }, uGA: { value: 0 },                      // spaghettification : étirement global depuis une ancre (z du vaisseau)
  uPlane: { value: new THREE.Vector4(0, 0, 1, -1e6) }, uClip: { value: 0 },
  uMat: { value: 0 }, uMatT: { value: 0 },                  // rematérialisation : 1 = absent, 0 = solide
};
const DEFORM_GLSL = `
  uniform mat4 uShip, uShipInv;
  uniform float uDT, uDW, uSpag, uSpagL, uPlaneZs, uPlaneDir, uWave, uStretch, uLag, uTwist, uBend, uG, uGA;
  vec3 sbDeform(vec3 w){
    vec3 s = (uShipInv * vec4(w, 1.0)).xyz;
    float ph = uDT * uDW;
    if (uWave + uStretch + uLag + uTwist + uBend > 0.001) {
      s.z *= 1.0 + uStretch * 0.42 * sin(ph);                                       // étirement / compression longitudinale
      s.xy *= 1.0 - uStretch * 0.18 * sin(ph);
      float band = pow(0.5 + 0.5 * sin(s.z * 0.85 - ph * 4.0), 8.0);                 // vague de compression qui court sur le blindage
      float band2 = pow(0.5 + 0.5 * sin(s.z * 1.7 + ph * 3.0 + 1.3), 10.0);
      s.xy *= 1.0 - uWave * (0.16 * band + 0.08 * band2);
      s.z += uWave * 0.30 * sin(s.z * 0.55 - ph * 2.0);
      float seg = floor(s.z * 0.6 + 0.5);                                            // tronçons momentanément en retard
      s.z -= uLag * 0.30 * (0.5 + 0.5 * sin(ph * 3.0 + seg * 2.1)) * step(0.3, fract(seg * 0.618 + 0.11));
      s.x += uBend * 0.9 * sin(s.z * 0.26 + ph * 2.0);                               // la coque ondule comme un corps
      s.y += uBend * 0.6 * cos(s.z * 0.21 - ph * 3.0);
      float tw = uTwist * 0.06 * s.z * sin(ph * 2.0);
      float c = cos(tw), sn = sin(tw); s.xy = mat2(c, -sn, sn, c) * s.xy;
    }
    if (uG > 0.001) {                                                                // spaghetti : de la proue à la poupe
      float k = 1.0 + uG;
      s.z = uGA + (s.z - uGA) * k;
      s.xy *= 1.0 / sqrt(k);
      s.xy += vec2(sin(s.z * 0.33 + ph * 3.0), cos(s.z * 0.29 - ph * 2.0)) * 0.10 * uG;
    }
    if (uSpag > 0.001) {                                                             // étirement vers le seuil du passage
      float D = (uPlaneZs - s.z) * uPlaneDir;
      float f = exp(-max(D, 0.0) / uSpagL);
      s.z += uPlaneDir * uSpag * uSpagL * f;
      s.xy *= 1.0 - 0.28 * uSpag * f;
    }
    return (uShip * vec4(s, 1.0)).xyz;
  }`;
// découpe au seuil + rematérialisation (le vaisseau se recompose par fragments, arêtes incandescentes)
const CLIP_GLSL = `uniform vec4 uPlane; uniform float uClip, uMat, uMatT; varying vec3 vSbW; varying vec3 vSbS;
  float sbH(vec3 p){ p = fract(p * 0.3183099 + .1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  float sbN(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(sbH(i), sbH(i + vec3(1,0,0)), f.x), mix(sbH(i + vec3(0,1,0)), sbH(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(sbH(i + vec3(0,0,1)), sbH(i + vec3(1,0,1)), f.x), mix(sbH(i + vec3(0,1,1)), sbH(i + vec3(1,1,1)), f.x), f.y), f.z); }`;
const CLIP_TEST = `if (uClip > 0.5 && dot(uPlane.xyz, vSbW) + uPlane.w > 0.0) discard;
  float sbEdge = 0.0;
  if (uMat > 0.001) {
    float sbn = sbN(vSbS * 1.6) * .55 + sbN(vSbS * 7.0) * .30 + sbH(floor(vSbS * 9.0)) * .15;
    float scan = .5 + .5 * sin(vSbS.z * 9.0 - uMatT * 40.0);
    float th = uMat * 1.08 - .04 + scan * .04 * uMat;
    if (sbn < th) discard;
    sbEdge = 1.0 - smoothstep(th, th + .07, sbn);
  }`;
function patchDeform(mat, extra) {
  mat.onBeforeCompile = (sh, r) => {
    if (extra) extra(sh, r);
    Object.assign(sh.uniforms, DEF);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\n' + DEFORM_GLSL + '\nvarying vec3 vSbW; varying vec3 vSbS;')
      .replace('#include <project_vertex>', `
        vec4 sbW = modelMatrix * vec4(transformed, 1.0);
        vSbS = (uShipInv * sbW).xyz;
        sbW.xyz = sbDeform(sbW.xyz); vSbW = sbW.xyz;
        vec4 mvPosition = viewMatrix * sbW;
        gl_Position = projectionMatrix * mvPosition;`)
      .replace('#include <worldpos_vertex>', `
        #if defined( USE_ENVMAP ) || defined( DISTANCE ) || defined ( USE_SHADOWMAP ) || defined ( USE_TRANSMISSION ) || NUM_SPOT_LIGHT_COORDS > 0
          vec4 worldPosition = sbW;
        #endif`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + CLIP_GLSL)
      .replace('#include <clipping_planes_fragment>', CLIP_TEST + '\n#include <clipping_planes_fragment>')
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n totalEmissiveRadiance += vec3(.78, .72, 1.0) * sbEdge * 5.0;');
  };
  const tag = (extra ? 'x-' + mat.name : '') + '-' + mat.type;
  mat.customProgramCacheKey = () => 'sbdef2' + tag;
}
const depthMat = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
patchDeform(depthMat);
const maskMat = new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false });
patchDeform(maskMat);

/* ═══════════════ fond : ciel, étoiles, soleil, poussière ═══════════════ */
const world = new THREE.Group(); scene.add(world);          // éléments de l'espace « normal »
const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 48, 32), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: NOISE_GLSL + `
    varying vec3 vDir;
    float fbm6(vec3 p){ float a=.5, s=0.; for(int i=0;i<6;i++){ s+=a*n3(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }
    void main(){
      vec3 d = normalize(vDir);
      vec3 axis = normalize(vec3(0.55, 0.75, -0.35));
      float band = exp(-pow(dot(d, axis) * 1.8, 2.0));
      float neb = band * smoothstep(.32, .82, fbm6(d * 3.2));
      float dust = fbm6(d * 6.5 + 4.0);
      vec3 col = vec3(.004,.006,.014);
      float hue = fbm6(d * 2.1 + 7.0);
      vec3 pc = mix(vec3(.08,.12,.48), vec3(.30,.08,.50), smoothstep(.35,.7,hue));
      col += pc * neb * .45;
      col += mix(vec3(.25,.40,.9), vec3(.60,.28,.95), smoothstep(.4,.7,hue)) * pow(neb, 2.4) * .45;
      col *= 1.0 - .7 * smoothstep(.45, .75, dust) * band;
      gl_FragColor = vec4(col, 1.0);
    }`
}));
world.add(sky);
function starField(count, radius, size) {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    pos.set([radius * s * Math.cos(t), radius * u, radius * s * Math.sin(t)], i * 3);
    const k = Math.random();
    c.setRGB(...(k > .92 ? [1, .8, .6] : k > .7 ? [.78, .86, 1] : [1, 1, 1])).multiplyScalar(.25 + Math.random() * .6);
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ size, sizeAttenuation: false, vertexColors: true, depthWrite: false, fog: false }));
}
world.add(starField(3200, 380, 1.2), starField(240, 380, 2.2));
{
  const N = 1400, B = 70, g = new THREE.BufferGeometry(), p = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) p.set([(Math.random() - .5) * B, (Math.random() - .5) * B * .6, (Math.random() - .5) * B + 5], i * 3);
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  world.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.03, color: 0x8ea4c8, transparent: true, opacity: .4, depthWrite: false, sizeAttenuation: true })));
}
function radialTex(stops, n = 256) {
  const c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d'), r = g.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
  for (const [o, col] of stops) r.addColorStop(o, col);
  g.fillStyle = r; g.fillRect(0, 0, n, n);
  return new THREE.CanvasTexture(c);
}
{
  const sunPos = SUN_DIR.clone().multiplyScalar(330);
  for (const [size, stops, opacity] of [
    [18,  [[0, 'rgba(255,255,255,1)'], [.35, 'rgba(255,250,235,1)'], [.5, 'rgba(255,235,200,.6)'], [1, 'rgba(255,220,180,0)']], 1.0],
    [110, [[0, 'rgba(255,240,215,.9)'], [.12, 'rgba(255,215,170,.4)'], [.4, 'rgba(200,170,255,.1)'], [1, 'rgba(120,120,255,0)']], .85],
  ]) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTex(stops), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity, fog: false }));
    sp.scale.set(size, size, 1); sp.position.copy(sunPos); world.add(sp);
  }
}

/* ═══════════════ lumière ═══════════════ */
const KEY_DEP = V3(-0.62, 0.55, -0.35).normalize();   // départ : le flanc vu de la caméra est éclairé
const key = new THREE.DirectionalLight(0xffd6b0, 2.1);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 60 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.015;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0x7a5cff, 0.9); rim.position.set(9, 4, 10); scene.add(rim);
const fill = new THREE.DirectionalLight(0x6a6080, 0.8); fill.position.set(3, 10, -4); scene.add(fill);
const hemi = new THREE.HemisphereLight(0x4a4560, 0x0a0806, 1.1); scene.add(hemi);
const portalL1 = new THREE.PointLight(0x9a6cff, 0, 70, 1.2), portalL2 = new THREE.PointLight(0xff9a50, 0, 50, 1.3);
scene.add(portalL1, portalL2);
const voyL = [0xd8c8ff, 0x8a5cff, 0xffb070].map(c => { const l = new THREE.PointLight(c, 0, 40, 1.2); scene.add(l); return l; });

/* ═══════════════ le TAXI ═══════════════ */
const SC = 0.0016, OFFZ = 0.184;                   // glTF (m) → scène : 7 170 m = 11,5 u ; gueule en +z
const TIP = 3347 * SC + OFFZ, STERN = -3620 * SC + OFFZ, HULL_R = 2450 * SC;
const Z_SPLIT = 20, Z_TIP = 1900, R_H1 = 2440, R_H2 = 2300;   // pinces : au-delà de z = 20 m, articulées à leur embase
const GLOSS = {
  M_EM_PLAQUE_A: [0.80, 0.38], M_EM_PLAQUE_B: [0.76, 0.40], M_EM_PLAQUE_C: [0.86, 0.32], M_EM_SOUS: [0.92, 0.25],
  M_EM_CUIVRE: [0.55, 0.75], M_EM_PL1: [1.0, 0.42], M_EM_PL2: [1.0, 0.42], M_EM_PL3: [1.0, 0.40], M_EM_PLI: [1.0, 0.35], M_EM_PL4: [1.0, 0.42],
  M_EM_CROC: [0.50, 0.75], M_EM_CROC_ACIER: [0.46, 0.75], M_EM_TRANCHEE: [0.85, 0.3],
};
const ship = new THREE.Group(); scene.add(ship);
const model = new THREE.Group(); model.scale.setScalar(SC); model.position.z = OFFZ; ship.add(model);
const pinces = [];
for (let k = 0; k < 4; k++) {
  const th = k * Math.PI / 2, er = V3(Math.cos(th), Math.sin(th), 0), et = V3(-Math.sin(th), Math.cos(th), 0);

const clock = new THREE.Clock();
