<style>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>

<div id="login" style="display:none;position:fixed;inset:0;z-index:50;background:rgba(1,2,8,.82);align-items:center;justify-content:center;padding:20px"><div style="width:100%;max-width:340px;background:#0b1320;border:1px solid rgba(127,208,255,.3);border-radius:14px;padding:18px">
  <div style="font-weight:800;letter-spacing:.2em;font-size:12px">MON COMPTE</div>
  <div style="font-size:12px;color:#9fb2c2;margin:8px 0 12px">Le labo lit ta partie dans le cloud (lecture seule, rien n'est modifié). Entre l'e-mail relié à ton compte Starbyte : tu reçois un code.</div>
  <input id="lg-mail" type="email" placeholder="e-mail" style="width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid rgba(127,208,255,.3);background:#0f1923;color:#e6f0ff;font-size:16px">

  <div id="lg-msg" style="font-size:11.5px;color:#ffb066;margin-top:8px;min-height:14px"></div>

<div id="card" style="display:none;position:fixed;left:10px;right:70px;bottom:calc(var(--sab) + 18px);z-index:30;background:rgba(8,13,20,.94);border:1px solid rgba(127,208,255,.3);border-radius:14px;padding:12px 14px">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><div id="cd-k" style="font-size:10px;letter-spacing:.14em;color:#7fd0ff;text-transform:uppercase"></div><div id="cd-t" style="font-weight:700;font-size:15px;margin-top:2px"></div><div id="cd-s" style="font-size:11.5px;color:#9fb2c2;margin-top:3px"></div></div><button id="cd-x" style="background:none;border:0;color:#9aa6b4;font-size:22px;line-height:1">×</button></div>
  <div id="cd-a" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px"></div></div>

<div id="tip"></div>
<script type="module">
import * as THREE from 'three';

/* ═════════════ outils ═════════════ */
const rng = (seed) => { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const hash = (s) => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.001, 20000);
const fx = document.getElementById('fx'), fxc = fx.getContext('2d');
const resize = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; };
addEventListener('resize', resize); resize();

const texCache = {};
function glow(a = 'rgba(255,255,255,1)', b = 'rgba(255,200,120,.5)') {
  const k = a + b; if (texCache[k]) return texCache[k];
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, a); g.addColorStop(.22, b); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return (texCache[k] = t);
}
function spr(tex, s, color = 0xffffff, op = 1) { const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color, transparent: true, opacity: op, depthWrite: false, blending: THREE.AdditiveBlending })); m.scale.setScalar(s); return m; }
function label(text, color = '#cfe6ff', size = 1) {
  const c = document.createElement('canvas'), x = c.getContext('2d'); const F = '600 34px -apple-system, system-ui, sans-serif'; x.font = F;
  const w = Math.ceil(x.measureText(text).width) + 20; c.width = w; c.height = 48; x.font = F; x.fillStyle = color; x.textBaseline = 'middle'; x.fillText(text, 10, 25);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, depthTest: false })); s.center.set(.5, 0); s.userData.k = size; s.userData.ar = w / 48; return s;
}
function dust(n, R, seed, size = 1.2, op = .8, spread = .15) {
  const r = rng(seed), p = new Float32Array(n * 3), c = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { p.set([(r() - .5) * R * 2, -R * spread * (.3 + r()), (r() - .5) * R * 2], i * 3); const w = .4 + r() * .6; c.set([w * .85, w * .9, w], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ size, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: op, depthWrite: false }));
}
function rockGeo(seed, detail = 2) {
  const g = new THREE.IcosahedronGeometry(1, detail), p = g.attributes.position, R = rng(seed), v = new THREE.Vector3();
  const k1 = V(R() - .5, R() - .5, R() - .5).normalize(), k2 = V(R() - .5, R() - .5, R() - .5).normalize();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); v.multiplyScalar(1 + .26 * Math.sin(v.dot(k1) * 3.3) + .14 * Math.sin(v.dot(k2) * 6.1) + (R() - .5) * .1); v.y *= .75; p.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals(); return g;
}
// échelle affichée (largeur de la vue)
function fmtLen(m) {
  const LY = 9.461e15;
  if (m >= LY * .5) return (m / LY).toFixed(m / LY < 10 ? 1 : 0) + ' a.l.';
  if (m >= 1e9) return Math.round(m / 1e9).toLocaleString('fr-CH') + ' millions de km';
  if (m >= 1e3) return Math.round(m / 1e3).toLocaleString('fr-CH') + ' km';
  if (m >= 1) return Math.round(m) + ' m';
  if (m >= .01) return Math.round(m * 100) + ' cm';
  if (m >= 1e-5) return Math.round(m * 1e6) + ' µm';
  if (m >= 1e-14) return '10⁻' + Math.round(-Math.log10(m)) + ' m';
  return '≈ longueur de Planck';
}

/* ═════════════ les plans d'existence ═════════════
   Chaque plan : une scène à plat (on la survole comme la carte de la planète), une échelle (mètres par unité),
   une hauteur de caméra min/max, et ce qu'on trouve en plongeant sous un point (child). */
const PLANS = {};
const sceneBase = (bg) => { const s = new THREE.Scene(); s.background = new THREE.Color(bg); return s; };

// ── Amas ──
function makeAmas(key, seed, name, neighbor) {
  const R = rng(seed), S = sceneBase(0x01030a), L = 260;
  S.add(dust(3000, L * 1.6, seed, 1.1, .7));
  const items = [];   // ce qu'on peut viser
  // zones : nappes de couleur très douces, nommées
  const zoneNames = ['Bras de Kerath', 'Couloir d’Erebus', 'Marges de Korr-Vask', 'Nébuleuse d’Ahn', 'Dérives de Caldris', 'Amas de Vérath'];
  const zoneCols = [0x2f6fb0, 0x6a3fb0, 0xb0603f, 0x2fa08a, 0x8a3f6a, 0x6a8a2f];
  const zones = [];
  for (let z = 0; z < 6; z++) {
    const zx = (R() - .5) * L * 1.5, zz = (R() - .5) * L * 1.5, zr = 70 + R() * 60;
    for (let k = 0; k < 7; k++) { const g = spr(glow('rgba(255,255,255,.55)', 'rgba(255,255,255,.12)'), zr * (1 + R()), zoneCols[z], .16); g.position.set(zx + (R() - .5) * zr, -2, zz + (R() - .5) * zr); g.material.blending = THREE.AdditiveBlending; S.add(g); }
    const lb = label(zoneNames[z].toUpperCase(), '#7f93a8', 2.2); lb.position.set(zx, 1, zz); S.add(lb); zones.push({ x: zx, z: zz, r: zr, lb });
  }
  // systèmes découverts (soleils) et masses chaudes non résolues
  for (let i = 0; i < 70; i++) {
    const x = (R() - .5) * L * 1.8, z = (R() - .5) * L * 1.8, known = R() < .45, sysName = `A-${name[0]}-${1000 + Math.floor(R() * 9000)}`;
    if (known) {
      const sun = new THREE.Group(); sun.position.set(x, 0, z);
      const col = [0xffd9a0, 0xfff1d0, 0xffb070, 0xa8c8ff][Math.floor(R() * 4)];
      sun.add(spr(glow('rgba(255,255,250,1)', 'rgba(255,190,110,.55)'), 9, col)); sun.add(spr(glow('rgba(255,220,170,.5)', 'rgba(255,150,70,.1)'), 26, col, .45));
      const lb = label(sysName, '#e8d8b8', 1); lb.position.set(0, 3, 0); sun.add(lb); sun.userData.lb = lb;
      S.add(sun); items.push({ kind: 'system', name: sysName, x, z, r: 9, obj: sun, seed: hash(sysName) });
    } else {
      const m = spr(glow('rgba(255,120,80,.9)', 'rgba(200,60,40,.25)'), 6, 0xff6a4a, .55); m.position.set(x, 0, z); m.userData.pulse = R() * 6; S.add(m);
      items.push({ kind: 'mass', name: 'Masse chaude · non résolue', x, z, r: 6, obj: m });
    }
  }
  // ma planète
  const home = new THREE.Group(); home.add(spr(glow('rgba(255,255,255,1)', 'rgba(127,208,255,.6)'), 7, 0x7fd0ff)); const hl = label('TA PLANÈTE · A-N-6834', '#9fdcff', 1.25); hl.position.set(0, 3, 0); home.add(hl); S.add(home);
  items.push({ kind: 'system', name: 'A-N-6834 · ton système', x: 0, z: 0, r: 8, obj: home, seed: 6834, home: true });
  // balises connues : des croix fines, visibles seulement de près (dans une zone)
  const beacons = new THREE.Group(); S.add(beacons);
  for (let i = 0; i < 18; i++) {
    const it = items[Math.floor(R() * items.length)]; const g = new THREE.Group();
    const m = new THREE.LineBasicMaterial({ color: 0xc89bff, transparent: true, opacity: .9 });
    g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints([V(-2.2, 0, 0), V(2.2, 0, 0), V(0, 0, -2.2), V(0, 0, 2.2)]), m));
    g.position.set(it.x + 5, .5, it.z - 4); beacons.add(g);
  }
  // routes connues
  for (let k = 0; k < 6; k++) {
    const a = items[Math.floor(R() * items.length)], b = items[Math.floor(R() * items.length)]; if (a === b) continue;
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(a.x, .2, a.z), V(b.x, .2, b.z)]), new THREE.LineDashedMaterial({ color: 0xff9a6a, dashSize: 3, gapSize: 2.5, transparent: true, opacity: .6 }));
    l.computeLineDistances(); S.add(l);
  }
  // frontière avec l'amas voisin : à l'est, on la lit en s'approchant ; on la touche pour passer
  const fx0 = L * 1.05;
  const border = new THREE.Mesh(new THREE.PlaneGeometry(60, L * 3.2), new THREE.MeshBasicMaterial({ color: neighbor.col, transparent: true, opacity: .1, side: THREE.DoubleSide, depthWrite: false }));
  border.rotation.x = -Math.PI / 2; border.position.set(fx0 + 30, -1, 0); S.add(border);
  const bl = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(fx0, 0, -L * 1.6), V(fx0, 0, L * 1.6)]), new THREE.LineDashedMaterial({ color: neighbor.col, dashSize: 6, gapSize: 4, transparent: true, opacity: .8 }));
  bl.computeLineDistances(); S.add(bl);
  for (const zz of [-L * .8, 0, L * .8]) { const lb = label(`FRONTIÈRE · ${neighbor.name.toUpperCase()}  →`, '#' + neighbor.col.toString(16).padStart(6, '0'), 1.6); lb.position.set(fx0 + 30, 1, zz); S.add(lb); }
  items.push({ kind: 'border', name: 'Passer dans ' + neighbor.name, x: fx0 + 30, z: 0, r: 30, wide: true, to: neighbor.key });
  return {
    key, name, scene: S, unit: 4e14, hMin: 9, hMax: 420, h0: 300, bounds: L * 1.25, title: name, kind: 'amas',
    hint: 'Glisse pour te déplacer · pince ou molette pour zoomer vers un point · vise un soleil et zoome pour y plonger',
    items, beacons, zones,
    update(t, h) { beacons.visible = h < 120; for (const z of zones) z.lb.material.opacity = clamp((h - 60) / 120, 0, 1); for (const it of items) if (it.obj && it.obj.userData.lb) it.obj.userData.lb.material.opacity = clamp((230 - h) / 90, 0, 1); for (const it of items) if (it.kind === 'mass') it.obj.material.opacity = .35 + .25 * Math.sin(t * 2 + it.obj.userData.pulse); },
  };
}

// ── Système : soleil au centre, signatures en orbite ──
function makeSystem(it) {
  const R = rng(it.seed), S = sceneBase(0x01020a);
  S.add(dust(1600, 400, it.seed, 1, .55));
  S.add(new THREE.AmbientLight(0x223044, 1.4));
  const sunL = new THREE.PointLight(0xffe0b0, 3, 0, 0); S.add(sunL);
  const sun = makeSun(13, it.port ? 0xffb066 : 0xffd29a); S.add(sun);
  const items = [], orbiters = [];
  const kinds = [['asteroides', "CHAMP D'ASTÉROÏDES", '#ffd9a0'], ['epave', 'ÉPAVE · TANKER', '#ffb0a0'], ['planete', 'PLANÈTE LIBRE', '#bfe6c0'], ['signature', 'SIG · ÉCHO MÉTALLIQUE', '#cdb8ff'], ['signature', 'SIG · MASSE FROIDE', '#cdb8ff'], ['planete', 'GÉANTE GAZEUSE', '#ffe0b0']];
  if (it.port && it.bodies && !it.bodies.some(b => b[0] === 'station')) it.bodies = [['station', String(it.port.name || 'Station').toUpperCase() + ' · STATION', '#ffcf96']].concat(it.bodies.filter(b => b[1] !== 'AUCUNE SIGNATURE CONNUE'));
  const n = it.bodies ? it.bodies.length : it.home ? 6 : 3 + Math.floor(R() * 4);
  for (let i = 0; i < n; i++) {
    const [kind, nm, col] = it.bodies ? it.bodies[i] : kinds[(i + Math.floor(R() * 2)) % kinds.length], rad = 40 + i * 26 + R() * 10, ang = R() * Math.PI * 2, spd = .05 / Math.sqrt(rad / 40) * (R() < .5 ? 1 : .8);
    const ring = new THREE.Mesh(new THREE.RingGeometry(rad - .15, rad + .15, 160), new THREE.MeshBasicMaterial({ color: 0x5a7a9a, transparent: true, opacity: .28, side: THREE.DoubleSide, depthWrite: false }));
    ring.rotation.x = -Math.PI / 2; S.add(ring);
    const g = new THREE.Group();
    if (kind === 'station') { const hx = new THREE.Mesh(new THREE.RingGeometry(4.2, 5, 6), new THREE.MeshBasicMaterial({ color: 0xffb066, side: THREE.DoubleSide, transparent: true, opacity: .95 })); hx.rotation.x = -Math.PI / 2; g.add(hx); g.add(spr(glow('rgba(255,240,220,1)', 'rgba(255,170,90,.5)'), 7, 0xffc890)); g.userData.spin = hx; }
    else if (kind === 'signature') { const ico = new THREE.Mesh(new THREE.IcosahedronGeometry(2.4, 0), new THREE.MeshBasicMaterial({ color: 0xa37dff, wireframe: true })); g.add(ico); g.userData.spin = ico; }
    else if (kind === 'planete') { const s = nm.startsWith('GÉANTE') ? 6 : 3.6; g.add(new THREE.Mesh(new THREE.SphereGeometry(s, 32, 20), new THREE.MeshStandardMaterial({ color: s > 5 ? 0xc9a06a : 0x6a8f6a, roughness: .8 }))); }
    else if (kind === 'asteroides') { const im = new THREE.InstancedMesh(rockGeo(it.seed + i, 1), new THREE.MeshStandardMaterial({ color: 0x8a8076, roughness: .95 }), 60); const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(); for (let k = 0; k < 60; k++) { const a = R() * 6.28, d = R() * 6; m4.compose(V(Math.cos(a) * d, (R() - .5) * 1.5, Math.sin(a) * d), q.setFromEuler(new THREE.Euler(R() * 3, R() * 3, R() * 3)), V(1, 1, 1).multiplyScalar(.2 + R() * .6)); im.setMatrixAt(k, m4); } g.add(im); }
    else { const m = new THREE.MeshStandardMaterial({ color: 0x5b6670, metalness: .8, roughness: .5 }); const a = new THREE.Mesh(new THREE.BoxGeometry(4.5, 1.2, 1.4), m); a.rotation.z = .25; g.add(a); const b = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1, 1.2), m); b.position.set(3.6, -1, .6); b.rotation.set(.4, .3, -.7); g.add(b); g.add(at(spr(glow('rgba(255,240,220,1)', 'rgba(255,90,40,.6)'), 2.2, 0xff7a3a), 2, .2, .9)); }
    const lb = label(nm, col, 1.8); lb.position.set(0, 4.5, 0); g.add(lb);
    S.add(g);
    const o = { kind, name: nm, rad, ang, spd, obj: g, r: 8, seed: it.seed + i * 977, port: kind === 'station' ? it.port : null, key: it.key };
    orbiters.push(o); items.push(o);
  }
  const place = () => { for (const o of orbiters) { o.x = Math.cos(o.ang) * o.rad; o.z = Math.sin(o.ang) * o.rad; o.obj.position.set(o.x, 0, o.z); } };
  place();
  return {
    key: 'sys:' + it.name + (it.bodies ? ':r' : ''), scene: S, unit: 3e9, hMin: 7, hMax: 520, h0: 380, bounds: 260, title: 'Système ' + it.name.split(' ·')[0], kind: 'systeme',
    hint: 'Le soleil au centre, les signatures en orbite · zoome vers une signature pour la rejoindre, ou au hasard pour plonger dans le vide',
    items, update(t, h, dt) { sun.userData.tick(t); for (const o of orbiters) { o.ang += o.spd * dt; if (o.obj.userData.spin) { o.obj.userData.spin.rotation.y = t * .6; o.obj.userData.spin.rotation.x = t * .3; } } place(); },
  };
}

// ── Les environs d'une signature ──
