<body>
<canvas id="fx"></canvas>
<div id="lab">LABO · PLANS</div>

<script type="module">
import * as THREE from 'three';

/* ═════════════ outils ═════════════ */
const rng = (seed) => { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const hash = (s) => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.001, 20000);
const fx = document.getElementById('fx'), fxc = fx.getContext('2d');
const resize = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; };
addEventListener('resize', resize); resize();

const texCache = {};
function glow(a = 'rgba(255,255,255,1)', b = 'rgba(255,200,120,.5)') {
  const k = a + b; if (texCache[k]) return texCache[k];
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, a); g.addColorStop(.22, b); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return (texCache[k] = t);
}
function spr(tex, s, color = 0xffffff, op = 1) { const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color, transparent: true, opacity: op, depthWrite: false, blending: THREE.AdditiveBlending })); m.scale.setScalar(s); return m; }
function label(text, color = '#cfe6ff', size = 1) {
  const c = document.createElement('canvas'), x = c.getContext('2d'); const F = '600 34px -apple-system, system-ui, sans-serif'; x.font = F;
  const w = Math.ceil(x.measureText(text).width) + 20; c.width = w; c.height = 48; x.font = F; x.fillStyle = color; x.textBaseline = 'middle'; x.fillText(text, 10, 25);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, depthTest: false })); s.center.set(.5, 0); s.userData.k = size; s.userData.ar = w / 48; return s;
}
function dust(n, R, seed, size = 1.2, op = .8, spread = .15) {
  const r = rng(seed), p = new Float32Array(n * 3), c = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { p.set([(r() - .5) * R * 2, -R * spread * (.3 + r()), (r() - .5) * R * 2], i * 3); const w = .4 + r() * .6; c.set([w * .85, w * .9, w], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ size, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: op, depthWrite: false }));
}
function rockGeo(seed, detail = 2) {
  const g = new THREE.IcosahedronGeometry(1, detail), p = g.attributes.position, R = rng(seed), v = new THREE.Vector3();
  const k1 = V(R() - .5, R() - .5, R() - .5).normalize(), k2 = V(R() - .5, R() - .5, R() - .5).normalize();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); v.multiplyScalar(1 + .26 * Math.sin(v.dot(k1) * 3.3) + .14 * Math.sin(v.dot(k2) * 6.1) + (R() - .5) * .1); v.y *= .75; p.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals(); return g;
}
// échelle affichée (largeur de la vue)
function fmtLen(m) {
  const LY = 9.461e15;
  if (m >= LY * .5) return (m / LY).toFixed(m / LY < 10 ? 1 : 0) + ' a.l.';
  if (m >= 1e9) return Math.round(m / 1e9).toLocaleString('fr-CH') + ' millions de km';
  if (m >= 1e3) return Math.round(m / 1e3).toLocaleString('fr-CH') + ' km';
  if (m >= 1) return Math.round(m) + ' m';
  if (m >= .01) return Math.round(m * 100) + ' cm';
  if (m >= 1e-5) return Math.round(m * 1e6) + ' µm';
  if (m >= 1e-14) return '10⁻' + Math.round(-Math.log10(m)) + ' m';
  return '≈ longueur de Planck';
}

/* ═════════════ les plans d'existence ═════════════
   Chaque plan : une scène à plat (on la survole comme la carte de la planète), une échelle (mètres par unité),
   une hauteur de caméra min/max, et ce qu'on trouve en plongeant sous un point (child). */
const PLANS = {};
const sceneBase = (bg) => { const s = new THREE.Scene(); s.background = new THREE.Color(bg); return s; };

// ── Amas ──
function makeAmas(key, seed, name, neighbor) {
  const R = rng(seed), S = sceneBase(0x01030a), L = 260;
  S.add(dust(3000, L * 1.6, seed, 1.1, .7));
  const items = [];   // ce qu'on peut viser
  // zones : nappes de couleur très douces, nommées
  const zoneNames = ['Bras de Kerath', 'Couloir d’Erebus', 'Marges de Korr-Vask', 'Nébuleuse d’Ahn', 'Dérives de Caldris', 'Amas de Vérath'];
  const zoneCols = [0x2f6fb0, 0x6a3fb0, 0xb0603f, 0x2fa08a, 0x8a3f6a, 0x6a8a2f];
  const zones = [];
  for (let z = 0; z < 6; z++) {
    const zx = (R() - .5) * L * 1.5, zz = (R() - .5) * L * 1.5, zr = 70 + R() * 60;
    for (let k = 0; k < 7; k++) { const g = spr(glow('rgba(255,255,255,.55)', 'rgba(255,255,255,.12)'), zr * (1 + R()), zoneCols[z], .16); g.position.set(zx + (R() - .5) * zr, -2, zz + (R() - .5) * zr); g.material.blending = THREE.AdditiveBlending; S.add(g); }
    const lb = label(zoneNames[z].toUpperCase(), '#7f93a8', 2.2); lb.position.set(zx, 1, zz); S.add(lb); zones.push({ x: zx, z: zz, r: zr, lb });
  }
  // systèmes découverts (soleils) et masses chaudes non résolues
  for (let i = 0; i < 70; i++) {
    const x = (R() - .5) * L * 1.8, z = (R() - .5) * L * 1.8, known = R() < .45, sysName = `A-${name[0]}-${1000 + Math.floor(R() * 9000)}`;
    if (known) {
      const sun = new THREE.Group(); sun.position.set(x, 0, z);
      const col = [0xffd9a0, 0xfff1d0, 0xffb070, 0xa8c8ff][Math.floor(R() * 4)];
      sun.add(spr(glow('rgba(255,255,250,1)', 'rgba(255,190,110,.55)'), 9, col)); sun.add(spr(glow('rgba(255,220,170,.5)', 'rgba(255,150,70,.1)'), 26, col, .45));
      const lb = label(sysName, '#e8d8b8', 1); lb.position.set(0, 3, 0); sun.add(lb); sun.userData.lb = lb;
      S.add(sun); items.push({ kind: 'system', name: sysName, x, z, r: 9, obj: sun, seed: hash(sysName) });
    } else {
      const m = spr(glow('rgba(255,120,80,.9)', 'rgba(200,60,40,.25)'), 6, 0xff6a4a, .55); m.position.set(x, 0, z); m.userData.pulse = R() * 6; S.add(m);
      items.push({ kind: 'mass', name: 'Masse chaude · non résolue', x, z, r: 6, obj: m });
    }
  }
  // ma planète
  const home = new THREE.Group(); home.add(spr(glow('rgba(255,255,255,1)', 'rgba(127,208,255,.6)'), 7, 0x7fd0ff)); const hl = label('TA PLANÈTE · A-N-6834', '#9fdcff', 1.25); hl.position.set(0, 3, 0); home.add(hl); S.add(home);
  items.push({ kind: 'system', name: 'A-N-6834 · ton système', x: 0, z: 0, r: 8, obj: home, seed: 6834, home: true });
  // balises connues : des croix fines, visibles seulement de près (dans une zone)
  const beacons = new THREE.Group(); S.add(beacons);
  for (let i = 0; i < 18; i++) {
    const it = items[Math.floor(R() * items.length)]; const g = new THREE.Group();
    const m = new THREE.LineBasicMaterial({ color: 0xc89bff, transparent: true, opacity: .9 });
    g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints([V(-2.2, 0, 0), V(2.2, 0, 0), V(0, 0, -2.2), V(0, 0, 2.2)]), m));
    g.position.set(it.x + 5, .5, it.z - 4); beacons.add(g);
  }
  // routes connues
  for (let k = 0; k < 6; k++) {
    const a = items[Math.floor(R() * items.length)], b = items[Math.floor(R() * items.length)]; if (a === b) continue;
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(a.x, .2, a.z), V(b.x, .2, b.z)]), new THREE.LineDashedMaterial({ color: 0xff9a6a, dashSize: 3, gapSize: 2.5, transparent: true, opacity: .6 }));
    l.computeLineDistances(); S.add(l);
  }
  // frontière avec l'amas voisin : à l'est, on la lit en s'approchant ; on la touche pour passer
  const fx0 = L * 1.05;
  const border = new THREE.Mesh(new THREE.PlaneGeometry(60, L * 3.2), new THREE.MeshBasicMaterial({ color: neighbor.col, transparent: true, opacity: .1, side: THREE.DoubleSide, depthWrite: false }));
  border.rotation.x = -Math.PI / 2; border.position.set(fx0 + 30, -1, 0); S.add(border);
  const bl = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(fx0, 0, -L * 1.6), V(fx0, 0, L * 1.6)]), new THREE.LineDashedMaterial({ color: neighbor.col, dashSize: 6, gapSize: 4, transparent: true, opacity: .8 }));
  bl.computeLineDistances(); S.add(bl);
  for (const zz of [-L * .8, 0, L * .8]) { const lb = label(`FRONTIÈRE · ${neighbor.name.toUpperCase()}  →`, '#' + neighbor.col.toString(16).padStart(6, '0'), 1.6); lb.position.set(fx0 + 30, 1, zz); S.add(lb); }
  items.push({ kind: 'border', name: 'Passer dans ' + neighbor.name, x: fx0 + 30, z: 0, r: 30, wide: true, to: neighbor.key });
  return {
    key, name, scene: S, unit: 4e14, hMin: 9, hMax: 420, h0: 300, bounds: L * 1.25, title: name, kind: 'amas',
    hint: 'Glisse pour te déplacer · pince ou molette pour zoomer vers un point · vise un soleil et zoome pour y plonger',
    items, beacons, zones,
    update(t, h) { beacons.visible = h < 120; for (const z of zones) z.lb.material.opacity = clamp((h - 60) / 120, 0, 1); for (const it of items) if (it.obj && it.obj.userData.lb) it.obj.userData.lb.material.opacity = clamp((230 - h) / 90, 0, 1); for (const it of items) if (it.kind === 'mass') it.obj.material.opacity = .35 + .25 * Math.sin(t * 2 + it.obj.userData.pulse); },
  };
}

// ── Système : soleil au centre, signatures en orbite ──
function makeSystem(it) {
  const R = rng(it.seed), S = sceneBase(0x01020a);
  S.add(dust(1600, 400, it.seed, 1, .55));
  S.add(new THREE.AmbientLight(0x223044, 1.4));
  const sunL = new THREE.PointLight(0xffe0b0, 3, 0, 0); S.add(sunL);
  S.add(spr(glow('rgba(255,255,245,1)', 'rgba(255,190,100,.6)'), 34)); S.add(spr(glow('rgba(255,210,150,.45)', 'rgba(255,130,60,.08)'), 120, 0xffaa66, .5));
  const items = [], orbiters = [];
  const kinds = [['asteroides', "CHAMP D'ASTÉROÏDES", '#ffd9a0'], ['epave', 'ÉPAVE · TANKER', '#ffb0a0'], ['planete', 'PLANÈTE LIBRE', '#bfe6c0'], ['signature', 'SIG · ÉCHO MÉTALLIQUE', '#cdb8ff'], ['signature', 'SIG · MASSE FROIDE', '#cdb8ff'], ['planete', 'GÉANTE GAZEUSE', '#ffe0b0']];
  const n = it.home ? 6 : 3 + Math.floor(R() * 4);
  for (let i = 0; i < n; i++) {
    const [kind, nm, col] = kinds[(i + Math.floor(R() * 2)) % kinds.length], rad = 40 + i * 26 + R() * 10, ang = R() * Math.PI * 2, spd = .05 / Math.sqrt(rad / 40) * (R() < .5 ? 1 : .8);
    const ring = new THREE.Mesh(new THREE.RingGeometry(rad - .15, rad + .15, 160), new THREE.MeshBasicMaterial({ color: 0x5a7a9a, transparent: true, opacity: .28, side: THREE.DoubleSide, depthWrite: false }));
    ring.rotation.x = -Math.PI / 2; S.add(ring);
    const g = new THREE.Group();
    if (kind === 'signature') { const ico = new THREE.Mesh(new THREE.IcosahedronGeometry(2.4, 0), new THREE.MeshBasicMaterial({ color: 0xa37dff, wireframe: true })); g.add(ico); g.userData.spin = ico; }
    else if (kind === 'planete') { const s = nm.startsWith('GÉANTE') ? 6 : 3.6; g.add(new THREE.Mesh(new THREE.SphereGeometry(s, 32, 20), new THREE.MeshStandardMaterial({ color: s > 5 ? 0xc9a06a : 0x6a8f6a, roughness: .8 }))); }
    else if (kind === 'asteroides') { const im = new THREE.InstancedMesh(rockGeo(it.seed + i, 1), new THREE.MeshStandardMaterial({ color: 0x8a8076, roughness: .95 }), 60); const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(); for (let k = 0; k < 60; k++) { const a = R() * 6.28, d = R() * 6; m4.compose(V(Math.cos(a) * d, (R() - .5) * 1.5, Math.sin(a) * d), q.setFromEuler(new THREE.Euler(R() * 3, R() * 3, R() * 3)), V(1, 1, 1).multiplyScalar(.2 + R() * .6)); im.setMatrixAt(k, m4); } g.add(im); }
    else { const m = new THREE.MeshStandardMaterial({ color: 0x5b6670, metalness: .8, roughness: .5 }); const a = new THREE.Mesh(new THREE.BoxGeometry(4.5, 1.2, 1.4), m); a.rotation.z = .25; g.add(a); const b = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1, 1.2), m); b.position.set(3.6, -1, .6); b.rotation.set(.4, .3, -.7); g.add(b); g.add(at(spr(glow('rgba(255,240,220,1)', 'rgba(255,90,40,.6)'), 2.2, 0xff7a3a), 2, .2, .9)); }
    const lb = label(nm, col, 1.8); lb.position.set(0, 4.5, 0); g.add(lb);
    S.add(g);
    const o = { kind, name: nm, rad, ang, spd, obj: g, r: kind === 'planete' ? 8 : 8, seed: it.seed + i * 977 };
    orbiters.push(o); items.push(o);
  }
  const place = () => { for (const o of orbiters) { o.x = Math.cos(o.ang) * o.rad; o.z = Math.sin(o.ang) * o.rad; o.obj.position.set(o.x, 0, o.z); } };
  place();
  return {
    key: 'sys:' + it.name, scene: S, unit: 3e9, hMin: 7, hMax: 520, h0: 380, bounds: 260, title: 'Système ' + it.name.split(' ·')[0], kind: 'systeme',
    hint: 'Le soleil au centre, les signatures en orbite · zoome vers une signature pour la rejoindre, ou au hasard pour plonger dans le vide',
    items, update(t, h, dt) { for (const o of orbiters) { o.ang += o.spd * dt; if (o.obj.userData.spin) { o.obj.userData.spin.rotation.y = t * .6; o.obj.userData.spin.rotation.x = t * .3; } } place(); },
  };
}

// ── Les environs d'une signature ──
function makeSig(it) {
  const R = rng(it.seed), S = sceneBase(0x01020a);
  S.add(dust(1500, 300, it.seed, 1, .5));
  S.add(new THREE.AmbientLight(0x1c2434, 1.1));
  const key = new THREE.DirectionalLight(0xffe2b0, 3); key.position.set(-80, 60, -40); S.add(key);
  const rim = new THREE.DirectionalLight(0x6aa8ff, 1.1); rim.position.set(60, 20, 80); S.add(rim);
  S.add(at(spr(glow('rgba(255,255,240,1)', 'rgba(255,190,90,.6)'), 60), -900, 400, -700));
  const items = [], spinners = [];
  if (it.kind === 'asteroides' || it.kind === 'signature') {
    const geos = [0, 1, 2, 3, 4, 5].map(i => rockGeo(it.seed + i));
    const mats = [0x857a70, 0x6d6560, 0x9a8a74].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: .95 }));
    const ore = new THREE.MeshStandardMaterial({ color: 0x5fe0ff, emissive: 0x1aa0d0, emissiveIntensity: 1.3, roughness: .2 });
    for (let i = 0; i < 220; i++) {
      const rk = new THREE.Mesh(geos[i % 6], mats[i % 3]); const a = R() * 6.28, d = 6 + Math.pow(R(), .7) * 120;
      const s = i < 6 ? 4 + R() * 3 : .4 + Math.pow(R(), 2.3) * 3.5;
      rk.position.set(Math.cos(a) * d, (R() - .5) * 6, Math.sin(a) * d * .8); rk.scale.setScalar(s); rk.rotation.set(R() * 6, R() * 6, R() * 6);
      if (i < 6 || R() < .07) for (let k = 0; k < 4; k++) { const c = new THREE.Mesh(new THREE.OctahedronGeometry(.15, 0), ore); const dir = V(R() - .5, R() - .5, R() - .5).normalize(); c.position.copy(dir.clone().multiplyScalar(.88)); c.scale.set(1, 1.8, 1); c.lookAt(dir.multiplyScalar(3)); rk.add(c); }
      rk.userData.spin = V((R() - .5) * .15, (R() - .5) * .15, 0); spinners.push(rk); S.add(rk);
      items.push({ kind: 'rock', name: i < 6 ? 'Astéroïde · minerai cristallin' : 'Fragment rocheux', x: rk.position.x, z: rk.position.z, r: s * 1.1, obj: rk, size: s });
    }
  } else if (it.kind === 'epave') {
    const dark = new THREE.MeshStandardMaterial({ color: 0x4d5762, metalness: .85, roughness: .45 }), lit = new THREE.MeshBasicMaterial({ color: 0xffb070 });
    const w = new THREE.Group(); w.rotation.set(.2, .7, .3); S.add(w);
    const body = new THREE.Mesh(new THREE.CylinderGeometry(4, 4.4, 26, 14, 1, true), dark); body.rotation.z = Math.PI / 2; w.add(body);
    for (let k = 0; k < 10; k++) { const p = new THREE.Mesh(new THREE.BoxGeometry(.7, .3, .1), lit); p.position.set(-9 + k * 2, 2.4, 3.7); w.add(p); }
    const br = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 4, 10, 14, 1, true), dark); br.position.set(19, -6, 3); br.rotation.set(.6, 0, 1.1); w.add(br);
    w.add(at(spr(glow('rgba(255,250,230,1)', 'rgba(255,110,40,.6)'), 9, 0xff8a40), 13, 0, 0));
    for (let k = 0; k < 90; k++) { const d = new THREE.Mesh(new THREE.BoxGeometry(.6 + R(), .1, .4 + R()), dark); d.position.set(12 + R() * 40, (R() - .5) * 12, (R() - .5) * 30); d.rotation.set(R() * 6, R() * 6, R() * 6); d.userData.spin = V(R() * .4, R() * .4, 0); spinners.push(d); S.add(d); items.push({ kind: 'rock', name: 'Débris de coque', x: d.position.x, z: d.position.z, r: 1.2, obj: d, size: 1 }); }
    items.push({ kind: 'rock', name: 'Coque du tanker', x: 0, z: 0, r: 14, obj: w, size: 12 });
  } else {
    const s = it.name.startsWith('GÉANTE') ? 60 : 36;
    const p = new THREE.Mesh(new THREE.SphereGeometry(s, 64, 40), new THREE.MeshStandardMaterial({ color: s > 50 ? 0xc9a06a : 0x6a8f6a, roughness: .85 })); p.position.set(0, -s - 6, 0); S.add(p);

  };
}

// ── Le vide ──
function makeVoid(seed) {
  const S = sceneBase(0x000104); const R = rng(seed);

  for (let k = 0; k < 4; k++) S.add(at(spr(glow('rgba(120,140,220,.25)', 'rgba(60,70,140,.05)'), 140 + R() * 100, 0x5a6ac0, .25), (R() - .5) * 300, -60, (R() - .5) * 300));
  return { key: 'vide:' + seed, scene: S, unit: 1e8, hMin: 4, hMax: 260, h0: 180, bounds: 180, title: 'Vide interstellaire', kind: 'vide', hint: 'Rien. Le vide. Zoome encore, au hasard : sous le vide, la structure.', items: [],
    update(t) { d1.position.x = Math.sin(t * .05) * 6; d2.position.z = Math.cos(t * .04) * 8; } };
}

// ── La structure quantique : des cordes qui vibrent ──
function makeQuantum(seed) {

    update(t) { for (const l of lines) { const u = l.userData, p = l.geometry.attributes.position; for (let k = 0; k < P; k++) { const s = k / (P - 1); if (u.closed) { const a = s * Math.PI * 2; const rr = u.r * (1 + .25 * Math.sin(a * u.f * 2 + t * u.sp * 3)); p.setXYZ(k, u.cx + Math.cos(a) * rr, Math.sin(a * 3 + t) * .6, u.z + Math.sin(a) * rr); } else { const x = (s - .5) * 300; p.setXYZ(k, x, Math.sin(s * u.f * 9 + t * u.sp + u.ph) * u.a, u.z + Math.sin(s * u.f * 5 - t * u.sp * .7) * u.a * .6); } } p.needsUpdate = true; } } };
}

// ── Le mur des tags ──
const WALL = 1000, wallCanvas = document.createElement('canvas'); wallCanvas.width = wallCanvas.height = WALL;
{
  const x = wallCanvas.getContext('2d'), R = rng(2026), pal = ['#ff4f40', '#ffb066', '#ffd27a', '#7fd0ff', '#2f8fd0', '#a37dff', '#5fcc8a', '#ffffff', '#ff7ab8', '#222034', '#e8e0c8'];
  x.fillStyle = '#0b0a14'; x.fillRect(0, 0, WALL, WALL);
  for (let k = 0; k < 900; k++) {
    const w = 4 + Math.floor(Math.pow(R(), 2.2) * 70), h = 4 + Math.floor(Math.pow(R(), 2.2) * 70), px = Math.floor(R() * (WALL - w)), py = Math.floor(R() * (WALL - h)); if (R() < .25) continue;
    x.fillStyle = pal[Math.floor(R() * pal.length)]; x.fillRect(px, py, w, h); const mo = Math.floor(R() * 4);
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) { const on = mo === 0 ? ((xx >> 1) + (yy >> 1)) % 2 === 0 : mo === 1 ? Math.hypot(xx - w / 2, yy - h / 2) < Math.min(w, h) / 3 : mo === 2 ? yy % 3 === 0 || xx % 5 === 0 : R() < .3; if (on) { x.fillStyle = pal[(k + mo + 3) % pal.length]; x.fillRect(px + xx, py + yy, 1, 1); } }
  }
  x.fillStyle = '#ffd27a'; x.font = 'bold 54px monospace'; x.fillText('STARBYTE', 380, 520); x.fillStyle = '#7fd0ff'; x.font = 'bold 22px monospace'; x.fillText('ESPACE LIBRE · 1 CHF', 404, 552);
}
const wallTex = new THREE.CanvasTexture(wallCanvas); wallTex.magFilter = THREE.NearestFilter; wallTex.colorSpace = THREE.SRGBColorSpace;
const wallMat = new THREE.ShaderMaterial({ uniforms: { map: { value: wallTex }, uGrid: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D map; uniform float uGrid; varying vec2 vUv; void main(){ vec4 c = texture2D(map, vUv); vec2 g = fract(vUv * ${WALL}.0); float e = max(step(.93, g.x), step(.93, g.y)); gl_FragColor = vec4(mix(c.rgb, c.rgb*.5 + vec3(.05,.08,.12), e*uGrid), 1.0); }` });

    update(t, h) { wallMat.uniforms.uGrid.value = clamp((12 - h) / 8, 0, 1); } };
}

/* ═════════════ navigation : ce qu'on trouve en plongeant sous un point ═════════════ */
const amasA = { key: 'A', name: 'Amas A', col: 0x7fd0ff }, amasB = { key: 'B', name: 'Amas B', col: 0xff9a6a };
const getPlan = (key, make) => PLANS[key] || (PLANS[key] = make());
function amas(k) { return k === 'A' ? getPlan('amasA', () => makeAmas('amasA', 11, 'Amas A', amasB)) : getPlan('amasB', () => { const p = makeAmas('amasB', 97, 'Amas B', amasA); return p; }); }
function childOf(plan, wx, wz) {

  let best = null, bd = Infinity;
  for (const it of plan.items) { if (it.wide || it.kind === 'mass') continue; const d = Math.hypot(it.x - wx, it.z - wz); if (d < it.r * 1.8 && d < bd) { bd = d; best = it; } }
  if (plan.kind === 'amas') { if (best && best.kind === 'system') return { plan: getPlan('sys:' + best.name, () => makeSystem(best)), via: best.name }; return { plan: getPlan('vide:' + Math.round(wx / 40) + ':' + Math.round(wz / 40), () => makeVoid(hash(plan.key + Math.round(wx / 40) + ':' + Math.round(wz / 40)))), via: 'vide' }; }
  if (plan.kind === 'systeme') { if (best) return { plan: getPlan('sig:' + best.seed, () => makeSig(best)), via: best.name }; return { plan: getPlan('vide:s' + plan.key, () => makeVoid(hash('v' + plan.key))), via: 'vide' }; }
  if (plan.kind === 'sig') { if (best) return { plan: getPlan('q:' + plan.key, () => makeQuantum(hash('q' + plan.key))), via: 'matière' }; return { plan: getPlan('vide:g' + plan.key, () => makeVoid(hash('g' + plan.key))), via: 'vide' }; }
  if (plan.kind === 'vide') return { plan: getPlan('q:' + plan.key, () => makeQuantum(hash('q' + plan.key))), via: 'structure' };

}

/* ═════════════ caméra : survol à plat, zoom vers le point visé ═════════════ */
let plan = amas('A'), stack = [];
let tx = 0, tz = 0, h = plan.h0;           // centre visé et hauteur de caméra (valeurs lissées)
let gx = 0, gz = 0, gh = plan.h0;          // valeurs visées
const TILT = .62;                           // la caméra regarde en biais : on sent la 3D
function placeCam() { camera.position.set(tx, h, tz + h * TILT); camera.lookAt(tx, 0, tz); }
const ndc = new THREE.Vector2(), ray = new THREE.Raycaster(), ground = new THREE.Plane(V(0, 1, 0), 0), hit = new THREE.Vector3();
function groundAt(cx, cy) { ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); return ray.ray.intersectPlane(ground, hit) ? hit.clone() : V(tx, 0, tz); }
let zoomPt = { x: innerWidth / 2, y: innerHeight / 2 }, trans = null;
function zoomBy(f, cx = innerWidth / 2, cy = innerHeight / 2) {
  if (trans) return;

  const before = groundAt(cx, cy);
  const nh = gh * f;
  if (nh < plan.hMin) { gh = plan.hMin; if (f < .999 && Math.abs(h - plan.hMin) < plan.hMin * .25) dive(before); return; }
  if (nh > plan.hMax) { gh = plan.hMax; if (f > 1.001 && Math.abs(h - plan.hMax) < plan.hMax * .08) surface(); return; }
  // garder le point visé sous le doigt : on rapproche le centre de ce point en proportion
  const k = 1 - nh / gh; gx += (before.x - gx) * k; gz += (before.z - gz) * k; gh = nh;
  gx = clamp(gx, -plan.bounds * 1.3, plan.bounds * 1.3); gz = clamp(gz, -plan.bounds * 1.3, plan.bounds * 1.3);
}
function startTrans(dir, next, at) {
  trans = { dir, t: 0, next, at, from: plan };
}
function dive(pt) {
  if (trans) return;
  const c = childOf(plan, pt.x, pt.z); if (!c) return;
  if (plan.kind === 'amas') { const b = plan.items.find(i => i.kind === 'border' && Math.abs(i.x - pt.x) < i.r); if (b) { goAmas(b.to); return; } }
  startTrans('in', c.plan, pt);
}
function surface() { if (trans || !stack.length) return; startTrans('out', null, null); }
function goAmas(k) { startTrans('jump', amas(k), null); }

/* ═════════════ gestes ═════════════ */
addEventListener('wheel', (e) => { e.preventDefault(); zoomBy(Math.exp(e.deltaY * .0016), e.clientX, e.clientY); }, { passive: false });
document.getElementById('zin').onclick = () => { for (let i = 0; i < 6; i++) setTimeout(() => zoomBy(.86), i * 30); };
document.getElementById('zout').onclick = () => { for (let i = 0; i < 6; i++) setTimeout(() => zoomBy(1.16), i * 30); };
const ptrs = new Map(); let pinch0 = 0, moved = 0;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0; if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); } });
cv.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p) { hover(e); return; }
  if (ptrs.size === 1 && !trans) { const a = groundAt(p.x, p.y), b = groundAt(e.clientX, e.clientY); gx -= b.x - a.x; gz -= b.z - a.z; tx = gx; tz = gz; moved += Math.abs(e.clientX - p.x) + Math.abs(e.clientY - p.y); gx = clamp(gx, -plan.bounds * 1.3, plan.bounds * 1.3); gz = clamp(gz, -plan.bounds * 1.3, plan.bounds * 1.3); }
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0) zoomBy(pinch0 / d, (a.x + b.x) / 2, (a.y + b.y) / 2); pinch0 = d; moved = 99; }
});
const up = (e) => { const was = ptrs.get(e.pointerId); ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; if (was && moved < 8 && !ptrs.size) tap(e); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
const tip = document.getElementById('tip');
function tap(e) {

  if (plan.kind === 'mur') { showWallTip(e, pt); return; }
  if (plan.kind === 'amas') { const b = plan.items.find(i => i.kind === 'border' && Math.abs(i.x - pt.x) < i.r); if (b) { goAmas(b.to); return; } }
  // toucher un objet : on glisse vers lui

  if (best) { gx = best.x; gz = best.z; flashTip(e, best.name + (best.kind === 'mass' ? ' · envoie une Radar pour la résoudre' : ' · zoome pour y plonger')); }
}
function flashTip(e, txt) { tip.textContent = txt; tip.style.display = 'block'; tip.style.left = Math.min(innerWidth - 240, e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 34) + 'px'; clearTimeout(flashTip.t); flashTip.t = setTimeout(() => tip.style.display = 'none', 1800); }
function hover(e) { if (plan.kind !== 'mur') return; showWallTip(e, groundAt(e.clientX, e.clientY)); }
function showWallTip(e, pt) {
  const u = (pt.x + 100) / 200, v = (pt.z + 100) / 200; if (u < 0 || u > 1 || v < 0 || v > 1) { tip.style.display = 'none'; return; }
  const x = Math.floor(u * WALL), y = Math.floor(v * WALL), d = wallCanvas.getContext('2d').getImageData(x, y, 1, 1).data, free = d[0] === 11 && d[1] === 10 && d[2] === 20;
  tip.innerHTML = `Espace <b>${x} · ${y}</b> — ${free ? '<span style="color:#7fd0ff">libre · 1 CHF</span>' : '<span style="color:#ffb066">déjà tagué</span>'}`; tip.style.display = 'block'; tip.style.left = Math.min(innerWidth - 220, e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 34) + 'px';
}

/* ═════════════ effet de zoom accéléré ═════════════ */
function drawStreaks(k, inward) {

  const R = rng(Math.floor(performance.now() / 40));
  fxc.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 180; i++) {
    const a = R() * Math.PI * 2, r0 = (20 + R() * Math.max(W, H) * .7) * (inward ? 1 : .6), len = (60 + R() * 260) * k * devicePixelRatio;
    const x0 = cx + Math.cos(a) * r0, y0 = cy + Math.sin(a) * r0, x1 = cx + Math.cos(a) * (r0 + len), y1 = cy + Math.sin(a) * (r0 + len);
    const g = fxc.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, 'rgba(160,210,255,0)'); g.addColorStop(1, `rgba(200,230,255,${.55 * k})`);

function stepTrans(dt) {

      const k = (t - .5) / .5; h = lerp(plan.hMin * .3, plan.hMin * 2.2, 1 - Math.pow(1 - k, 3)); drawStreaks(1 - k, false); }
  } else { // jump : passer la frontière vers l'amas voisin

    else { if (!trans.swapped) { plan = trans.next; stack = []; tx = gx = -plan.bounds * .85; tz = gz = 0; h = gh = plan.h0 * .7; trans.swapped = true; enterPlan(); } drawStreaks((1 - (t - .5) / .5) * .7, true); }
  }

}

/* ═════════════ HUD ═════════════ */
const planEl = document.getElementById('plan'), subEl = document.getElementById('sub'), pathEl = document.getElementById('path'), hintEl = document.getElementById('hint'), scaleEl = document.querySelector('#scale span');
function enterPlan() {
  planEl.textContent = { amas: 'Plan de l’amas', systeme: 'Plan du système', sig: 'Plan de la signature', vide: 'Plan du vide', quantique: 'Plan quantique', mur: 'Plan des tags' }[plan.kind];
  subEl.textContent = plan.title; hintEl.textContent = plan.hint;
  pathEl.textContent = stack.map(s => s.plan.title).concat(plan.title).join('  ›  ');
  tip.style.display = 'none';
}
enterPlan();

/* ═════════════ boucle ═════════════ */
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), .05), time = clock.elapsedTime;

  placeCam();
  // les étiquettes gardent une taille lisible à l'écran
  plan.scene.traverse(o => { if (o.isSprite && o.userData.ar) { const s = h * .0105 * o.userData.k; o.scale.set(s * o.userData.ar, s, 1); } });

}
window.__lab = { get busy() { return !!trans; }, zoomBy, get plan() { return plan; }, get h() { return h; }, dive: (x, z) => dive(V(x, 0, z)), surface, goAmas, settle() { h = gh; tx = gx; tz = gz; } };
frame();
