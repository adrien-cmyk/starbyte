# Publie le jeu (dossier github_upload/) sur https://play.starbyte.online, hébergé chez Infomaniak.
# Envoi en FTPS (chiffré) avec lftp. Seuls les fichiers modifiés partent : le serveur garde la liste
# des empreintes (.deploy-manifest) de la dernière publication, on compare, on n'envoie que la différence.
# Le dossier server/ (SQL, fonction des raids) n'est jamais envoyé.
# Identifiants : secrets INFOMANIAK_FTP_SERVER, INFOMANIAK_FTP_USER, INFOMANIAK_FTP_PASSWORD.
name: Publier sur play.starbyte.online
on:
  push:
    branches: [main]
    paths: ['github_upload/**']
  workflow_dispatch:
    inputs:
      tout:
        description: 'Tout renvoyer (ignorer la liste du serveur)'
        type: boolean
        default: false
      diagnostic:
        description: 'Seulement lister le contenu du serveur FTP (rien n''est envoyé)'
        type: boolean
        default: false
concurrency:
  group: publier-infomaniak
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.INFOMANIAK_FTP_SERVER }}
      FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
      FTP_PASS: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
    steps:
      - name: Vérifier les identifiants
        run: |
          if [ -z "$FTP_HOST" ]; then echo "::warning::Secrets Infomaniak absents : rien n'est publié."; echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
        with:
          sparse-checkout: |
            github_upload
            tools
          sparse-checkout-cone-mode: true
      - name: Installer lftp
        if: env.SKIP != '1'
        # 11/11 : security.ubuntu.com injoignable depuis les machines de GitHub (3 échecs de suite) ;
        # si l'installation normale échoue, on prend lftp sur le miroir principal d'Ubuntu, seul
        run: |
          if ! sudo apt-get install -y -qq lftp >/dev/null; then
            echo "lftp : dépôt de sécurité injoignable, essai sur le miroir principal"
            . /etc/os-release
            printf 'deb http://azure.archive.ubuntu.com/ubuntu %s main universe\ndeb http://azure.archive.ubuntu.com/ubuntu %s-updates main universe\n' "$VERSION_CODENAME" "$VERSION_CODENAME" > /tmp/miroir.list
            A="-o Dir::Etc::sourcelist=/tmp/miroir.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0"
            sudo apt-get update -qq $A || true
            sudo apt-get install -y -qq $A lftp >/dev/null || true
          fi
          if command -v lftp >/dev/null; then lftp --version | head -1; else echo "::warning::lftp indisponible : envoi par curl (FTPS), sans contrôle des fichiers absents du serveur."; fi
      - name: Diagnostic (contenu du serveur)
        if: env.SKIP != '1' && inputs.diagnostic
        run: |
          cat > /tmp/rc <<RC
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          open -u "$FTP_USER","$FTP_PASS" ftp://$FTP_HOST
          RC
          lftp -c "source /tmp/rc; pwd; cls -1 --sort=name ./" > /tmp/ls.txt 2>&1 || true
          lftp -c "source /tmp/rc; rm -r -f up" >> /tmp/ls.txt 2>&1 || true
          lftp -c "source /tmp/rc; cat .htaccess" >> /tmp/ls.txt 2>&1 || true
          echo "::notice title=Racine FTP::$(head -60 /tmp/ls.txt | tr '\n' '|')"
          echo "STOP=1" >> "$GITHUB_ENV"
      - name: Versions des fichiers (?v= = empreinte du fichier)
        if: env.SKIP != '1' && env.STOP != '1'
        run: node tools/versionner.mjs   # 08/11 : plus de ?v= à la main, chaque fichier modifié reçoit une nouvelle adresse
      - name: Calculer ce qui a changé
        if: env.SKIP != '1' && env.STOP != '1'
        run: |
          set -e
          cd github_upload
          rm -rf server
          python3 ../tools/precache_list.py .   # liste du premier téléchargement de l'app (précache.json)
          find . -type f ! -name '.deploy-manifest' -print0 | sort -z | xargs -0 sha256sum > /tmp/local.manifest
          cat > /tmp/lftprc <<RC
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 30
          open -u "$FTP_USER","$FTP_PASS" ftp://$FTP_HOST
          RC
          : > /tmp/remote.manifest
          if [ "${{ inputs.tout }}" != "true" ]; then
            if command -v lftp >/dev/null; then
              lftp -c "source /tmp/lftprc; get -O /tmp .deploy-manifest" 2>/dev/null && mv /tmp/.deploy-manifest /tmp/remote.manifest || echo "Pas de liste sur le serveur : envoi complet."
            else   # 11/11 : sans lftp, la liste des empreintes par curl (FTPS explicite, certificat vérifié)
              curl -sS --ssl-reqd --retry 3 -m 60 --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/.deploy-manifest" -o /tmp/remote.manifest || { : > /tmp/remote.manifest; echo "Pas de liste sur le serveur : envoi complet."; }
            fi
          fi
          # fichiers dont l'empreinte a changé ou qui sont nouveaux
          awk 'NR==FNR { seen[$2]=$1; next } seen[$2] != $1 { print $2 }' /tmp/remote.manifest /tmp/local.manifest > /tmp/changed
          # 24/10 : la liste du serveur peut mentir (fichiers notés comme envoyés mais absents : script 3D,
          # icônes, manifeste en 404). On liste donc ce qui existe vraiment et on renvoie tout ce qui manque.
          if command -v lftp >/dev/null && lftp -c "source /tmp/lftprc; find ." > /tmp/remote.files 2>/dev/null && [ -s /tmp/remote.files ]; then
            awk '{ print $2 }' /tmp/local.manifest | grep -vxF -f /tmp/remote.files > /tmp/missing || true
            echo "Fichiers absents du serveur : $(wc -l < /tmp/missing)"
            head -30 /tmp/missing
            cat /tmp/changed /tmp/missing | sort -u > /tmp/changed2 && mv /tmp/changed2 /tmp/changed
          else
            echo "::warning::Impossible de lister le serveur : seule la liste des empreintes est utilisée."
          fi
          echo "Fichiers à envoyer : $(wc -l < /tmp/changed)"
          head -50 /tmp/changed
          mkdir -p /tmp/up
          while IFS= read -r f; do mkdir -p "/tmp/up/$(dirname "$f")"; cp "$f" "/tmp/up/$f"; done < /tmp/changed
          cp /tmp/local.manifest /tmp/up/.deploy-manifest
      - name: Envoyer chez Infomaniak
        if: env.SKIP != '1' && env.STOP != '1'
        run: |
          set -e
          # index.html en dernier : quand la page change, tous les fichiers qu'elle appelle sont déjà là
          if [ -f /tmp/up/index.html ]; then mv /tmp/up/index.html /tmp/index.html; fi
          if command -v lftp >/dev/null; then
            lftp -c "source /tmp/lftprc; mirror -R --parallel=4 --no-perms /tmp/up ."   # « . » sans barre : sinon lftp crée un dossier up/
            if [ -f /tmp/index.html ]; then lftp -c "source /tmp/lftprc; put -O ./ /tmp/index.html"; fi
          else   # 11/11 : sans lftp, envoi fichier par fichier avec curl (FTPS explicite, certificat vérifié, dossiers créés au besoin)
            cd /tmp/up
            find . -type f -print0 | while IFS= read -r -d '' f; do
              curl -sS --ssl-reqd --ftp-create-dirs --retry 3 -m 300 --user "$FTP_USER:$FTP_PASS" -T "$f" "ftp://$FTP_HOST/${f#./}"
            done
            if [ -f /tmp/index.html ]; then curl -sS --ssl-reqd --retry 3 -m 120 --user "$FTP_USER:$FTP_PASS" -T /tmp/index.html "ftp://$FTP_HOST/index.html"; fi
          fi
          echo "Publié."
      - name: Vérifier en ligne les fichiers clés
        if: env.SKIP != '1' && env.STOP != '1'
        run: |
          # le jeu sans ces fichiers = carte 2D de secours et icône « S » générique chez les nouveaux joueurs
          cd github_upload
          KO=0
          for f in manifest.webmanifest assets/app/apple-touch-icon.png assets/app/icon-192.png $(grep -oE 'assets/[a-z0-9_/]+\.js' index.html | sort -u); do
            c=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "https://play.starbyte.online/$f")
            if [ "$c" != "200" ]; then echo "::error title=Fichier absent en ligne::$f → $c"; KO=1; fi
          done
          [ "$KO" = "0" ] && echo "Tous les fichiers clés répondent." || exit 1
